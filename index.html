<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hawklets">
<title>Hawklets CYO Basketball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f8;--surface:#fff;--subtle:#fafafa;--hover:#f4f4f5;
  --ink:#18181b;--ink2:#3f3f46;--muted:#6b6b76;--line:#e8e8ec;--line2:#d4d4d8;
  --navy:#1e3a8a;--navy2:#1d4ed8;--brand-soft:#eef2ff;
  --green:#15803d;--green-soft:#ecfdf3;--amber:#b45309;--amber-soft:#fffbeb;--red:#b91c1c;--red-soft:#fef2f2;
  --r:10px;--r-sm:8px;
  --shadow:0 1px 2px rgba(24,24,27,.04);
  --lift:0 8px 24px rgba(24,24,27,.10),0 1px 2px rgba(24,24,27,.06);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:64px;--safe-b:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font);font-feature-settings:"cv11","ss01";font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
::selection{background:#dbe4ff;color:var(--ink)}
h1,h2,h3,p{margin:0}
a{color:var(--navy2);text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--navy2);outline-offset:2px;border-radius:6px}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}

/* shell */
.page{max-width:720px;margin:0 auto;padding:0 16px calc(var(--nav-h) + var(--safe-b) + 28px)}
.head{display:flex;align-items:center;gap:12px;margin:0 -16px 16px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.mark{position:relative;width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 13px/1 var(--font);letter-spacing:.02em;flex:none}
.mark::after,.jn::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed rgba(255,255,255,.5);pointer-events:none}
.head .t{flex:1;min-width:0}
.head h1{font:600 20px/1.2 var(--font);letter-spacing:-.02em}
.head p{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink2);transition:background .15s}
.iconbtn:hover{background:var(--hover)}
.iconbtn svg{width:18px;height:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card h2{font:600 15px/1.3 var(--font);letter-spacing:-.01em}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.label{font-size:12px;font-weight:500;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* next game */
.hero{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.hero .day{font:600 24px/1.2 var(--font);letter-spacing:-.025em;margin:2px 0 4px;text-wrap:balance}
.hero .meta{color:var(--muted);font-size:14px}
.hero .bar{height:6px;border-radius:99px;background:var(--hover);margin:16px 0 8px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--navy);border-radius:99px;transition:width .3s cubic-bezier(.2,.8,.2,1)}
.hero .who{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.countdown{display:inline-flex;align-items:center;border:1px solid var(--line);color:var(--ink2);background:var(--subtle);border-radius:99px;white-space:nowrap;margin-top:4px;padding:2px 10px;font:500 12px/1.6 var(--font)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:13px;text-align:center;transition:background .15s,border-color .15s}
.tile:hover{background:var(--subtle);border-color:var(--line2)}
.tile i{width:34px;height:34px;border-radius:var(--r-sm);background:var(--brand-soft);color:var(--navy);display:grid;place-items:center}
.tile svg{width:18px;height:18px}

/* segmented availability */
.seg{display:inline-grid;grid-template-columns:repeat(3,1fr);background:var(--hover);border-radius:var(--r-sm);padding:2px;gap:2px;min-width:192px}
.seg button{border:0;background:transparent;border-radius:6px;padding:7px 0;font-weight:500;font-size:13px;color:var(--ink2);transition:background .15s,color .15s}
.seg button:hover:not(.on){background:rgba(255,255,255,.8)}
.seg button.on{box-shadow:0 1px 2px rgba(24,24,27,.12)}
.seg button.on.yes{background:var(--green);color:#fff}
.seg button.on.maybe{background:var(--amber);color:#fff}
.seg button.on.no{background:var(--red);color:#fff}

/* lists */
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:14px;padding:12px 0}
.list>.li:first-child{padding-top:0}.list>.li:last-child{padding-bottom:0}
.date{flex:none;width:46px;height:50px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--subtle);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.date small{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
.date b{font:600 19px/1 var(--font);margin-top:3px;letter-spacing:-.02em}
.date.past{opacity:.55}
.li h3{font-size:15px;font-weight:500}
.li p{font-size:13px;color:var(--muted)}
.game{display:flex;flex-direction:column;gap:12px;padding:14px 0}
.list>.game:first-child{padding-top:0}.list>.game:last-child{padding-bottom:0}
.counts{display:flex;gap:6px;flex-wrap:wrap}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:99px;border:1px solid var(--line);background:var(--subtle);color:var(--ink2);white-space:nowrap;line-height:1.6}
.pill.green{background:var(--green-soft);border-color:#c7ecd4;color:var(--green)}.pill.amber{background:var(--amber-soft);border-color:#fde7b0;color:var(--amber)}.pill.red{background:var(--red-soft);border-color:#fcd4d4;color:var(--red)}.pill.blue{background:var(--brand-soft);border-color:#dbe2fe;color:var(--navy)}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* jersey-number patch (kept): navy disc, white numeral, stitched ring */
.jn{position:relative;flex:none;width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 17px/1 var(--font);letter-spacing:-.02em;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--line2)}
.jn.none{background:transparent;color:var(--muted);box-shadow:none}
.jn.none::after{inset:0;border:1.5px dashed var(--line2)}
.jn.hd{width:36px;height:36px;font-size:15px}
.jn.sm{width:32px;height:32px;font-size:14px}
.jn.xs{width:24px;height:24px;font-size:11px;box-shadow:none}
.jn.xs::after{inset:2px}
.jn.xs.none::after{inset:0;border-color:var(--muted);border-width:1px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field+.field{margin-top:16px}
.field>.lab{font-size:13px;font-weight:500;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.field>.lab span{font-weight:400;color:var(--muted)}
input,select,textarea{font:400 15px var(--font);color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:var(--r-sm);padding:10px 12px;width:100%;min-height:44px;caret-color:var(--navy2);transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:#8a8a94}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(29,78,216,.15)}
textarea{min-height:96px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:var(--r-sm);padding:8px 12px;font-weight:500;font-size:14px;min-height:40px;color:var(--ink2);transition:background .12s,border-color .12s,color .12s}
.chip:hover:not(:disabled):not(.on){background:var(--subtle)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip:disabled{opacity:.4;cursor:not-allowed}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.num{border:1px solid var(--line2);background:#fff;border-radius:50%;aspect-ratio:1;max-width:52px;width:100%;justify-self:center;font:600 15px/1 var(--font);color:var(--ink);transition:background .12s,border-color .12s}
.num:hover:not(:disabled):not(.first){background:var(--brand-soft);border-color:#c7d2fe}
.num.first{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--navy)}
.num.taken,.num:disabled{color:#b4b4bc;background:var(--hover);border-color:transparent;text-decoration:line-through;cursor:not-allowed}
.check{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line2);border-radius:var(--r-sm);font-weight:500}
.check input{width:20px;height:20px;min-height:0;accent-color:var(--navy)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .full{grid-column:1/-1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r-sm);padding:10px 16px;min-height:44px;font-weight:500;font-size:14px;text-decoration:none;background:var(--navy);color:#fff;transition:background .15s,border-color .15s,transform .08s}
.btn:hover{background:#172f74}
.btn:active{transform:scale(.98)}
.btn.soft{background:var(--brand-soft);color:var(--navy)}
.btn.soft:hover{background:#e0e7ff}
.btn.ghost{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.btn.ghost:hover{background:var(--subtle)}
.btn.danger{background:var(--surface);border-color:#fcd4d4;color:var(--red)}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* todo */
.todo{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.todo+.todo{border-top:1px solid var(--line)}
.todo:first-child{padding-top:0}.todo:last-child{padding-bottom:0}
.tick{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);margin-top:2px}
.tick.red{border-color:var(--red)}
.tick.done{background:var(--green);border-color:var(--green);display:grid;place-items:center;color:#fff}
.tick.done svg{width:12px;height:12px}
.todo b{display:block;font-weight:500}
.todo span{font-size:13px;color:var(--muted)}

/* chat */
.chatwrap{display:flex;flex-direction:column;gap:10px;padding-bottom:84px}
.msg{max-width:82%;align-self:flex-start}
.msg .bub{background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:8px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end}
.msg.me .bub{background:var(--navy);border-color:var(--navy);color:#fff;border-radius:12px 12px 4px 12px}
.msg .meta{font-size:12px;color:var(--muted);margin:4px 6px 0}
.msg.me .meta{text-align:right}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b));padding:10px 16px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:4}
.composer form{max-width:720px;margin:0 auto;display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--lift);border-radius:var(--r);padding:6px}
.composer textarea{border:0;min-height:40px;height:40px;resize:none;padding:9px 10px;box-shadow:none!important}
.composer .btn{min-height:40px}

/* navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:4px 8px calc(4px + var(--safe-b))}
.nav .in{max-width:620px;margin:0 auto;display:flex;gap:2px}
.nav button{flex:1;border:0;background:none;border-radius:var(--r-sm);padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);min-height:52px;transition:color .15s,background .15s}
.nav button:hover{color:var(--ink)}
.nav svg{width:22px;height:22px}
.nav button.on{color:var(--navy)}
.nav button.on svg{stroke-width:2.2}
.nav .badge{position:relative}
.nav .badge::after{content:"";position:absolute;top:1px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}

/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);z-index:9;padding:0 16px;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.savebar .in{max-width:620px;margin:0 auto;background:var(--ink);color:#fff;border-radius:var(--r);padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 12px 32px rgba(24,24,27,.25)}
.savebar .grow{font-weight:500;font-size:14px}
.savebar .btn{min-height:38px;background:#fff;color:var(--ink)}
.savebar .btn:hover{background:#f4f4f5}
.savebar .btn.ghost{background:transparent;border-color:rgba(255,255,255,.2);color:#fff}
@keyframes up{from{transform:translateY(12px);opacity:0}}

/* toast */
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:#fff;border-radius:var(--r-sm);padding:9px 14px 9px 10px;font-weight:500;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(24,24,27,.2);animation:drop .2s cubic-bezier(.2,.8,.2,1);max-width:92vw}
#toast i{width:18px;height:18px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none}
#toast.err i{background:var(--red)}
#toast svg{width:11px;height:11px}
@keyframes drop{from{transform:translate(-50%,-8px);opacity:0}}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(24,24,27,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:540px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:10px 20px calc(20px + var(--safe-b));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:36px;height:4px;border-radius:99px;background:var(--line2);margin:0 auto 14px}
.sheet h2{font:600 18px/1.3 var(--font);letter-spacing:-.02em;margin-bottom:16px}
@keyframes fade{from{opacity:0}}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:12px;box-shadow:var(--lift)}}

/* coach */
.subnav{display:flex;gap:2px;overflow-x:auto;padding:0;margin:-4px 0 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:none;border:0;background:none;padding:9px 12px;font-weight:500;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
.subnav button:hover{color:var(--ink)}
.subnav button.on{color:var(--ink);border-bottom-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px}
.stat b{display:block;font:600 22px/1.2 var(--font);letter-spacing:-.025em}
.stat span{font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:center;padding:0 6px 8px;white-space:nowrap}
td{padding:8px 6px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:500;padding-right:12px}
.c{display:inline-block;text-align:center;width:26px;height:22px;line-height:22px;border-radius:5px;font-size:11px;font-weight:600}
.c.yes{background:var(--green-soft);color:var(--green)}.c.maybe{background:var(--amber-soft);color:var(--amber)}.c.no{background:var(--red-soft);color:var(--red)}.c.none{color:#b4b4bc}
.saved{color:var(--green);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.saved svg{width:14px;height:14px}
select.mini{width:84px;min-height:36px;padding:6px 8px;font-weight:600}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;background:var(--bg)}
.login .card{max-width:400px;width:100%;margin:0 auto;padding:28px 24px 24px;box-shadow:var(--lift)}
.login .mark{width:44px;height:44px;font-size:15px;margin-bottom:18px}
.login h1{font:600 22px/1.25 var(--font);letter-spacing:-.025em}
.login p{color:var(--muted);font-size:14px;margin:6px 0 20px}
.err{color:var(--red);font-weight:500;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:20px 0;font-size:14px}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,#efeff1 0%,#f7f7f8 50%,#efeff1 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

@media (max-width:420px){.hero .day{font-size:22px}.nums{gap:6px}.seg{min-width:180px}}

/* ---------- desktop: sidebar + three-column dashboard ---------- */
.dash{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(330px,.95fr);gap:16px;align-items:start}
.dash>.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.chatcard{position:sticky;top:20px;display:flex;flex-direction:column;height:calc(100vh - 120px);min-height:420px;padding:0;overflow:hidden}
.chatcard .hd{padding:14px 16px 12px;margin:0;border-bottom:1px solid var(--line)}
.chatbox{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--subtle)}
.chatcard form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chatcard textarea{min-height:40px;height:40px;resize:none}
.mini-game{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mini-game:first-child{border-top:0;padding-top:0}
.mini-game .seg{min-width:150px}.mini-game .seg button{padding:5px 0;font-size:12px}
.mini-game .cts{font-size:12px;white-space:nowrap;margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.stats.auto{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.tbl{font-size:13px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{position:static}
.tbl thead th{border-bottom:1px solid var(--line)}
.tbl tbody tr:hover td{background:var(--subtle)}
.tbl th button{border:0;background:none;font:inherit;color:inherit;padding:0;cursor:pointer}
.tbl th button:hover,.tbl th button.on{color:var(--ink)}
.tbl .num-c{text-align:center;padding-top:4px;padding-bottom:4px}
.tbl td.trunc{max-width:190px;overflow:hidden;text-overflow:ellipsis}
.tbl tr.mine td{background:var(--brand-soft)!important}
.grid-av th,.grid-av td{padding:7px 4px;text-align:center}
.grid-av td:nth-child(-n+4),.grid-av th:nth-child(-n+4){text-align:left;padding-left:8px}
.sticky1{position:sticky!important;left:0;background:var(--surface)!important;z-index:1}
.tbl tbody tr:hover td.sticky1{background:var(--subtle)!important}.tbl tr.mine td.sticky1{background:var(--brand-soft)!important}
.dot-ok{color:var(--green);display:inline-flex;vertical-align:middle}.dot-ok svg{width:16px;height:16px}
.dot-no{color:var(--red);font-weight:500}.dot-q{color:var(--muted)}
@media (min-width:1100px){
  .nav{top:0;bottom:0;right:auto;width:228px;border-top:0;border-right:1px solid var(--line);background:var(--subtle);padding:18px 12px}
  .nav::before{content:"Hawklets";display:block;font:600 15px/1 var(--font);letter-spacing:-.01em;color:var(--ink);padding:6px 10px 2px}
  .nav::after{content:"Rockhurst freshman CYO";display:block;position:absolute;top:44px;left:22px;font-size:12px;color:var(--muted)}
  .nav .in{flex-direction:column;gap:1px;max-width:none;margin-top:30px}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;padding:7px 10px;font-size:14px;min-height:0;border-radius:6px;color:var(--ink2)}
  .nav button:hover{background:var(--hover);color:var(--ink)}
  .nav button.on{background:#ececef;color:var(--ink)}
  .nav svg{width:17px;height:17px}
  .page{max-width:1480px;margin:0 0 0 228px;padding:0 28px 48px}
  .head{margin:0 -28px 20px;padding:16px 28px}
  .savebar{left:228px}
  .composer{left:228px}
  .chatwrap{padding-bottom:96px}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toastHost"></div>
<script>
"use strict";
/* ============ server (Supabase RPC) ============ */
const CFG = { url: "https://bndhgvqhujdvxoataslo.supabase.co", key: "sb_publishable_6aSptnsIzUenzEV44DECtg_iUXerDuL" };
const RPC = {
  login: ["email", "password"], getData: ["token"], getMessages: ["token", "since"],
  savePlayerInfo: ["token", "player_id", "info"], setAvailability: ["token", "player_id", "game_date", "v"], postMessage: ["token", "body"],
  adminSavePlayer: ["token", "p"], adminSaveGame: ["token", "g"], adminPostAnnouncement: ["token", "a"],
  adminSaveSettings: ["token", "o"], adminDelete: ["token", "item_kind", "item_id"]
};
async function api(fn, ...args) {
  const body = {}; RPC[fn].forEach((k, i) => body[k] = args[i]);
  let r;
  try {
    r = await fetch(`${CFG.url}/rest/v1/rpc/${fn.replace(/[A-Z]/g, c => "_" + c.toLowerCase())}`,
      { method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.key }, body: JSON.stringify(body) });
  } catch (e) { throw new Error("No connection. Check your signal and try again."); }
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) || "Something went wrong. Try again.");
  return j;
}

/* ============ constants & helpers ============ */
const LEGAL = ["0","1","2","3","4","5","10","11","12","13","14","15","20","21","22","23","24","25","30","31","32","33","34","35","40","41","42","43","44","45","50","51","52","53","54","55"];
const SIZES = [["YL","Youth L"],["YXL","Youth XL"],["AS","Adult S"],["AM","Adult M"],["AL","Adult L"],["AXL","Adult XL"],["A2XL","Adult 2XL"],["A3XL","Adult 3XL"]];
const SIZE = Object.fromEntries(SIZES);
const AV = { yes: "In", maybe: "Maybe", no: "Out" };
const ICON = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  schedule: '<rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
  chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.7A8 8 0 1 1 21 12z"/>',
  player: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  team: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/>',
  coach: '<path d="M12 3 4 6v6c0 4.4 3.4 8.2 8 9 4.6-.8 8-4.6 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  text: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.7A8 8 0 1 1 21 12z"/><path d="M8 11h8M8 14.5h5"/>',
  phone: '<path d="M5 3h3.5l2 5-2.5 1.5a11 11 0 0 0 6.5 6.5L16 13.5l5 2V19a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/>',
  shirt: '<path d="M8 3 3 6l2 5 3-1v11h8V10l3 1 2-5-5-3a4 4 0 0 1-8 0z"/>',
  out: '<path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H3"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>',
  pin: '<path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>'
};
const svg = (k, w) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w || 2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);
const dt = d => new Date(d + "T12:00:00");
const fmt = (d, o) => dt(d).toLocaleDateString("en-US", o || { weekday: "short", month: "short", day: "numeric" });
const todayISO = () => new Date().toLocaleDateString("en-CA");
const daysTo = d => Math.round((dt(d) - dt(todayISO())) / 864e5);
const usd = v => v == null ? "–" : "$" + Number(v).toLocaleString("en-US", { maximumFractionDigits: 2 });
const tel = p => String(p || "").replace(/\D/g, "");
const phone = p => { const t = tel(p).replace(/^1(?=\d{10}$)/, ""); return t.length === 10 ? `${t.slice(0, 3)}-${t.slice(3, 6)}-${t.slice(6)}` : (p || ""); };
const first = n => String(n || "").split(" ")[0];
const held = p => String(p.jersey || p.jersey1 || "");  /* his number: coach-set or his saved pick */
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };

/* ============ state ============ */
const S = { token: store.get("cyoToken"), data: null, tab: "home", ctab: "overview", sort: { k: "jersey", dir: 1 }, drafts: {}, lastMsg: "", seenMsg: store.get("seenMsg") || "", sheetOpen: false };
const D = () => S.data;
const WIDE = () => window.matchMedia("(min-width:1100px)").matches;
let wasWide = WIDE();
window.addEventListener("resize", () => { if (WIDE() !== wasWide) { wasWide = WIDE(); if (S.data) render(); } });
const chatLive = () => S.tab === "chat" || (S.tab === "home" && WIDE());
const dirty = () => Object.keys(S.drafts).length > 0;

function toast(msg, isErr) {
  const h = $("toastHost");
  h.innerHTML = `<div id="toast" class="${isErr ? "err" : ""}" role="status"><i>${svg(isErr ? "x" : "check", 3)}</i>${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => h.innerHTML = "", isErr ? 4200 : 2200);
}
function fail(e) {
  const m = (e && e.message) || String(e);
  if (m.includes("AUTH")) { logout(); toast("Please sign in again.", true); return; }
  toast(m, true);
}
function logout() { store.set("cyoToken", null); S.token = null; S.data = null; S.drafts = {}; render(); }

async function load(quiet) {
  if (!S.token) return render();
  try {
    S.data = await api("getData", S.token);
    const m = S.data.messages; S.lastMsg = m.length ? m[m.length - 1].ts : "";
    if (chatLive()) markSeen();
    render(quiet);
  } catch (e) { fail(e); }
}
function markSeen() { S.seenMsg = S.lastMsg; store.set("seenMsg", S.lastMsg); }

/* Background refresh: never while editing, typing or with a sheet open. Chat polls every 8s. */
setInterval(() => {
  if (!S.token || !S.data || document.hidden || chatLive() || S.tab === "coach") return;
  const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (!dirty() && !S.sheetOpen && !typing) load(true);
}, 60000);
setInterval(() => {
  if (!S.token || !S.data || document.hidden || !chatLive()) return;
  api("getMessages", S.token, S.lastMsg).then(ms => {
    if (!ms.length) return;
    S.data.messages = S.data.messages.concat(ms); S.lastMsg = ms[ms.length - 1].ts; markSeen(); renderChat(true);
  }).catch(() => {});
}, 8000);
window.addEventListener("beforeunload", e => { if (dirty()) { e.preventDefault(); e.returnValue = ""; } });

/* ============ render ============ */
function render(keepScroll) {
  const y = window.scrollY, app = $("app");
  if (!S.token) { app.innerHTML = loginView(); return; }
  if (!S.data) { app.innerHTML = `<div class="page stack"><div class="skel" style="height:200px"></div><div class="skel"></div><div class="skel"></div></div>`; return; }
  const d = D(), tabs = [["home", "Home"], ["schedule", "Schedule"], ["chat", "Chat"], ["player", "My player"], ["team", "Team"]];
  if (d.me.admin) tabs.push(["coach", "Coach"]);
  if (!tabs.some(t => t[0] === S.tab)) S.tab = "home";
  if (chatLive()) markSeen();
  const unread = d.messages.length && S.lastMsg > S.seenMsg && !chatLive();
  app.innerHTML = `<main class="page">${VIEW[S.tab](d)}</main>
    ${S.tab === "chat" ? composer() : ""}
    ${dirty() ? saveBar() : ""}
    <nav class="nav" aria-label="Sections"><div class="in">${tabs.map(t =>
      `<button data-tab="${t[0]}" class="${S.tab === t[0] ? "on" : ""}" ${S.tab === t[0] ? 'aria-current="page"' : ""}><span class="${t[0] === "chat" && unread ? "badge" : ""}">${svg(t[0])}</span>${t[1]}</button>`).join("")}</div></nav>`;
  if (chatLive()) renderChat(false);
  if (keepScroll) window.scrollTo(0, y);
}
const patch = (n, cls) => `<span class="jn${cls ? " " + cls : ""}${n ? "" : " none"}"${n ? ` aria-label="Number ${esc(n)}"` : ' aria-label="No number yet"'}>${n ? esc(n) : ""}</span>`;
function head(title, sub, right) {
  const p = S.data && S.data.mine && S.data.mine[0], n = p ? held(p) : "";
  return `<header class="head">${n ? patch(n, "hd") : '<div class="mark" aria-hidden="true">RH</div>'}<div class="t"><h1>${esc(title)}</h1><p>${esc(sub)}</p></div>${right || ""}</header>`;
}

/* ---------- login ---------- */
function loginView() {
  return `<div class="login"><form class="card" id="loginForm" novalidate>
    <div class="mark" aria-hidden="true">RH</div><h1>Hawklets CYO</h1>
    <p>Rockhurst freshmen basketball, winter 2026-27. Sign in with your email, or your son's Rockhurst email, and the team password.</p>
    <div class="field"><label class="lab" for="lgEmail">Email</label><input id="lgEmail" type="email" autocomplete="email" inputmode="email" autocapitalize="none" required></div>
    <div class="field"><label class="lab" for="lgPw">Team password</label><input id="lgPw" type="password" autocomplete="current-password" required></div>
    <p id="lgErr" class="err" role="alert" style="margin:14px 0 0" hidden></p>
    <button class="btn block" type="submit" style="margin-top:20px">Sign in</button>
  </form></div>`;
}

/* ---------- shared pieces ---------- */
const where = g => [g.time, g.opponent ? "vs " + g.opponent : "", g.location].filter(Boolean).join(" · ") || "Time and gym post about a week before";
const counts = (d, g) => { const r = { yes: 0, maybe: 0, no: 0 }; d.players.forEach(p => { const v = (p.avail || {})[g.date]; if (r[v] != null) r[v]++; }); return r; };
const upcoming = d => d.games.filter(g => g.date >= todayISO());
function seg(pid, date, cur) {
  return `<div class="seg" role="group" aria-label="Availability ${esc(fmt(date))}">${["yes", "maybe", "no"].map(v =>
    `<button data-act="avail" data-pid="${esc(pid)}" data-date="${esc(date)}" data-v="${v}" class="${v}${cur === v ? " on" : ""}" aria-pressed="${cur === v}">${AV[v]}</button>`).join("")}</div>`;
}
function dateTile(d, past) { return `<div class="date${past ? " past" : ""}"><small>${esc(fmt(d, { month: "short" }))}</small><b>${dt(d).getDate()}</b></div>`; }
function uniPill(p) {
  if (p.needsUniform === "no" || p.uniform === "has") return '<span class="pill green dot">Has uniform</span>';
  if (p.uniformOrdered || p.uniform === "ordered") return '<span class="pill green dot">Ordered</span>';
  if (p.needsUniform === "yes" || p.uniform === "needs") return '<span class="pill amber dot">To order</span>';
  return '<span class="pill dot">No info yet</span>';
}

/* ---------- views ---------- */
const VIEW = {
home(d) { return WIDE() ? dashboard(d) : this.homeMain(d); },
homeMain(d, noHead) {
  const s = d.settings, g = upcoming(d)[0], todo = [];
  d.mine.forEach(p => {
    const f = first(p.name);
    if (!p.registered) todo.push(["red", `${f} needs to accept his CYO invite`, "Use the link in his Rockhurst email. Forwarded links won't work."]);
    if (!held(p)) todo.push(["", `Claim ${f}'s jersey number`, "First come, first served on My player.", "player"]);
    if (!p.needsUniform) todo.push(["", `Tell us about ${f}'s uniform`, "Sizes, or whether he already has one.", "player"]);
    else if (p.needsUniform === "yes" && !p.uniformOrdered) todo.push(["", `Order ${f}'s uniform${s.uniformDue ? " by " + fmt(s.uniformDue) : ""}`, held(p) ? `His number is #${held(p)}.` : "Claim his number first."]);
    const miss = upcoming(d).filter(x => !(p.avail || {})[x.date]).length;
    if (miss) todo.push(["", `Answer ${miss} game date${miss > 1 ? "s" : ""} for ${f}`, "In, Maybe or Out on Schedule.", "schedule"]);
    const bal = s.feeReady !== "yes" || d.share == null ? 0 : Math.max(0, d.share - Number(p.paid || 0));
    if (bal) todo.push(["", `Pay ${usd(bal)}${s.payDue ? " by " + fmt(s.payDue) : ""}`, `Venmo ${s.venmo || ""} or a check to ${s.checkPayee || ""}. Put ${f}'s name in the note.`]);
  });
  const c = g ? counts(d, g) : null, n = g ? daysTo(g.date) : 0;
  return (noHead ? "" : head("Hi, " + first(String(d.me.name).replace(/^Coach /, "")), "Hawklets · Rockhurst freshmen CYO",
      `<button class="iconbtn" data-act="logout" aria-label="Sign out">${svg("out")}</button>`)) +
    `<div class="stack">` +
    (g ? `<section class="hero">
        <div class="row between" style="align-items:flex-start"><p class="day">${esc(fmt(g.date, { weekday: "long", month: "long", day: "numeric" }))}</p><span class="countdown">${n === 0 ? "Today" : n === 1 ? "Tomorrow" : "In " + n + " days"}</span></div>
        <p class="meta">${g.kind === "tournament" ? "Tournament · " : "Next game · "}${esc(where(g))}</p>
        <div class="bar"><i style="width:${Math.round(c.yes / Math.max(1, d.count) * 100)}%"></i></div>
        <p class="meta small">${c.yes} of ${d.count} players in · bring his student ID</p>
        ${d.mine.map(p => `<div class="who"><span class="row" style="gap:10px">${patch(held(p), "sm")}<b>${esc(first(p.name))}</b></span>${seg(p.id, g.date, (p.avail || {})[g.date] || "")}</div>`).join("")}
      </section>` : "") +
    `<div class="tiles">
      ${s.coachPhone ? `<a class="tile" href="sms:${tel(s.coachPhone)}"><i>${svg("text")}</i>Text Coach</a>` : ""}
      <button class="tile" data-tab="player"><i>${svg("player")}</i>My player</button>
      <a class="tile" href="${esc(s.uniformLink || "#")}" target="_blank" rel="noopener"><i>${svg("shirt")}</i>Order uniform</a>
    </div>
    <section class="card"><div class="hd"><h2>Your to-do list</h2>${todo.length ? `<span class="pill amber">${todo.length} left</span>` : ""}</div>
      ${todo.length ? todo.map(t => `<div class="todo"><span class="tick ${t[0]}"></span><div class="grow"><b>${esc(t[1])}</b><span>${esc(t[2])}</span></div>${t[3] ? `<button class="btn sm soft" data-tab="${t[3]}">Go</button>` : ""}</div>`).join("")
        : `<div class="todo"><span class="tick done">${svg("check", 3)}</span><div><b>You're all set</b><span>Nothing to do right now.</span></div></div>`}
    </section>` +
    (d.announcements.length ? `<section class="card"><div class="hd"><h2>From Coach</h2></div><div class="list">${d.announcements.slice(0, 4).map(a =>
      `<div class="li" style="display:block"><h3>${esc(a.title)}</h3><p class="muted small">${esc(fmt(String(a.ts).slice(0, 10)))}</p><p style="color:var(--ink2);white-space:pre-wrap;margin-top:4px">${esc(a.body)}</p></div>`).join("")}</div></section>` : "") +
    (s.feeReady === "yes" ? `<section class="card"><div class="hd"><h2>Team fee</h2><span class="pill blue">${usd(d.share)} each</span></div>
      <p class="muted small">CYO charges ${usd(s.teamFee)} per team, split across ${d.count} players. Venmo <b style="color:var(--ink)">${esc(s.venmo || "")}</b> or a check to ${esc(s.checkPayee || "")}${s.payDue ? `, due ${esc(fmt(s.payDue))}` : ""}.</p></section>` : "") + `
    <section class="card"><div class="hd"><h2>Coach ${esc(s.coach || "")}</h2></div>
      <div class="btns">${s.coachPhone ? `<a class="btn" href="sms:${tel(s.coachPhone)}">${svg("text")}Text</a><a class="btn soft" href="tel:${tel(s.coachPhone)}">${svg("phone")}Call</a>` : ""}
      <a class="btn ghost" style="grid-column:1/-1" href="mailto:${esc(s.coachEmail || "")}">${svg("mail")}${esc(s.coachEmail || "")}</a></div>
      <p class="muted small" style="margin-top:12px">${s.coachPhone ? esc(s.coachPhone) + " · " : ""}${s.assistant ? "Assistant coach " + esc(s.assistant) + " · " : ""}<a href="${esc(s.cyoLink || "#")}" target="_blank" rel="noopener">CYO league page</a></p></section>
    </div>`;
},

schedule(d) {
  const t = todayISO();
  return head("Schedule", "Saturdays · times and gyms post a week ahead") +
    `<section class="card"><div class="list">${d.games.map(g => {
      const c = counts(d, g), past = g.date < t;
      return `<div class="game"><div class="row">${dateTile(g.date, past)}<div class="grow"><h3 style="font-size:16px;font-weight:600">${esc(fmt(g.date, { weekday: "long" }))}${g.kind === "tournament" ? ' <span class="pill blue">Tournament</span>' : ""}</h3><p class="muted small">${esc(where(g))}</p>${g.note ? `<p class="small" style="margin-top:2px">${esc(g.note)}</p>` : ""}</div></div>
        ${past ? "" : d.mine.map(p => `<div class="row between"><span class="row small" style="gap:8px;font-weight:600">${patch(held(p), "xs")}${esc(first(p.name))}</span>${seg(p.id, g.date, (p.avail || {})[g.date] || "")}</div>`).join("")}
        <div class="counts"><span class="pill green">${c.yes} in</span><span class="pill amber">${c.maybe} maybe</span><span class="pill red">${c.no} out</span></div></div>`;
    }).join("")}</div></section>`;
},

chat(d) {
  return head("Team chat", "Everyone on the team sees these") + `<div class="chatwrap" id="chatList"></div>`;
},

player(d) {
  if (!d.mine.length) return head("My player", "Coach account") + `<section class="card"><p class="empty">You're signed in as coach without a player. Use the Coach tab.</p></section>`;
  const taken = new Map(d.players.filter(p => !p.mine && p.jersey).map(p => [String(p.jersey), first(p.name)]));
  return head("My player", "Number, uniform and contact") + `<div class="stack">` + d.mine.map(p => {
    const v = Object.assign({}, p, S.drafts[p.id] || {}), f = first(p.name), num = (S.drafts[p.id] || {}).jersey1 !== undefined ? S.drafts[p.id].jersey1 : held(p);
    const nine = v.shortLength === "9";
    return `<section class="card">
      <div class="row" style="margin-bottom:16px"><div class="jn${held(p) ? "" : " none"}">${held(p) ? esc(held(p)) : "?"}</div><div class="grow"><h2 style="font-size:20px">${esc(p.name)}</h2>
        <div class="row wrap" style="gap:6px;margin-top:6px">${p.registered ? '<span class="pill green dot">On CYO roster</span>' : '<span class="pill red dot">Not on CYO yet</span>'}${held(p) ? `<span class="pill blue">#${esc(held(p))} is his</span>` : '<span class="pill amber">No number yet</span>'}${d.settings.feeReady !== "yes" ? "" : (d.share && Number(p.paid || 0) >= d.share) ? '<span class="pill green">Paid</span>' : `<span class="pill amber">${usd(Math.max(0, (d.share || 0) - Number(p.paid || 0)))} due</span>`}</div></div></div>

      <div class="field"><div class="lab">Jersey number <span>${num ? "#" + esc(num) + (num === held(p) ? " is his" : " · tap Save to claim") : "First come, first served"}</span></div>
        <p class="muted small" style="margin-top:-4px">Pick one number and tap Save. Once saved it's his. Grey numbers already belong to a teammate.</p>
        <div class="nums">${LEGAL.map(n => {
          const mineN = num === n, isTaken = !mineN && taken.has(n);

      ${v.needsUniform === "no" ? "" : `

      <div class="field"><div class="lab">Shorts</div><div class="chips">${[["7", '7" mesh'], ["9", '9" with liner']].map(o =>

      <div class="field"><label class="check"><input type="checkbox" data-act="ordered" data-pid="${esc(p.id)}" ${v.uniformOrdered ? "checked" : ""}> I've ordered ${esc(f)}'s uniform</label></div>`}

    </section>`;

},

team(d) {
  const ps = d.players.slice().sort((a, b) => (a.jersey === "" || a.jersey == null ? 999 : +a.jersey) - (b.jersey === "" || b.jersey == null ? 999 : +b.jersey) || a.name.localeCompare(b.name));
  const gs = d.games, t = todayISO(), next = gs.find(g => g.date >= t);
  const reg = ps.filter(p => p.registered).length, nums = ps.filter(p => p.jersey).length;
  const uni = ps.filter(p => p.uniform === "has" || p.uniform === "ordered").length, info = ps.filter(p => p.form).length;

  const uniTxt = u => ({ has: '<span class="dot-ok">Has one</span>', ordered: '<span class="dot-ok">Ordered</span>', needs: '<span style="color:var(--amber);font-weight:700">To order</span>' }[u] || '<span class="dot-q">–</span>');
  return head("Team", `${d.count} players · ${reg} on the CYO roster`) +
    `<div class="stack"><div class="stats auto">
      <div class="stat"><b>${d.count}</b><span>Players</span></div>
      <div class="stat"><b>${reg}/${d.count}</b><span>On CYO roster</span></div>
      <div class="stat"><b>${nums}/${d.count}</b><span>Numbers claimed</span></div>
      <div class="stat"><b>${uni}/${d.count}</b><span>Uniforms set</span></div>
      <div class="stat"><b>${next ? counts(d, next).yes : "–"}</b><span>In for ${next ? esc(fmt(next.date, { month: "short", day: "numeric" })) : "next game"}</span></div>
      <div class="stat"><b>${Math.round(answered / Math.max(1, d.count * gs.length) * 100)}%</b><span>Availability answered</span></div>
    </div>
    <section class="card"><div class="hd"><h2>Roster and availability</h2><span class="muted small">I = in · M = maybe · O = out</span></div>
    <div class="scroll"><table class="tbl grid-av"><thead><tr><th class="sticky1">#</th><th>Player</th><th>CYO</th><th>Uniform</th>${gs.map(g => `<th title="${esc(fmt(g.date))}">${esc(fmt(g.date, { month: "numeric", day: "numeric" }))}${g.kind === "tournament" ? "*" : ""}</th>`).join("")}</tr></thead><tbody>
    ${ps.map(p => `<tr class="${p.mine ? "mine" : ""}"><td class="sticky1 num-c">${patch(p.jersey, "xs")}</td><td><b>${esc(p.name)}</b>${p.mine ? ' <span class="pill blue">Yours</span>' : ""}</td><td>${p.registered ? `<span class="dot-ok" aria-label="Yes">${svg("check", 3)}</span>` : '<span class="dot-no">Not yet</span>'}</td><td>${uniTxt(p.uniform)}</td>${gs.map(g => `<td>${cell((p.avail || {})[g.date])}</td>`).join("")}</tr>`).join("")}
    <tr><td class="sticky1"></td><td><b>In</b></td><td></td><td></td>${gs.map(g => { const c = counts(d, g).yes; return `<td><b style="color:var(--${c >= 5 ? "green" : "red"})">${c}</b></td>`; }).join("")}</tr>
    </tbody></table></div><p class="muted small" style="margin-top:10px">* Tournament. CYO needs 5 players by the end of the first quarter. ${info} of ${d.count} families have saved player info.</p></section></div>`;
},

coach(d) {
  const sub = [["overview", "Overview"], ["uniforms", "Numbers & uniforms"], ["roster", "Roster"], ["avail", "Availability"], ["money", "Money"], ["games", "Games"], ["news", "Post update"], ["settings", "Settings"]];
  return head("Coach", "Coaches only") +
    `<div class="stack"><nav class="subnav" aria-label="Coach sections">${sub.map(x => `<button data-act="ctab" data-id="${x[0]}" class="${S.ctab === x[0] ? "on" : ""}">${x[1]}</button>`).join("")}</nav>${COACH[S.ctab](d)}</div>`;
}
};


/* ---------- desktop dashboard: everything on one screen ---------- */
function dashboard(d) {
  const t = todayISO(), games = d.games.filter(g => g.date >= t);
  const mine = d.mine.map(p => {
    const v = (k, f) => p[k] ? f(p[k]) : "–";
    const uni = p.needsUniform === "no" ? "Has one" : p.uniformOrdered ? "Ordered" : p.needsUniform === "yes" ? "To order" : "Not set";
    const answered = Object.keys(p.avail || {}).length;
    return `<section class="card"><div class="hd"><h2>${esc(p.name)}</h2><button class="btn sm soft" data-tab="player">Edit</button></div>
      <div class="row" style="gap:16px;align-items:flex-start"><div class="jn${held(p) ? "" : " none"}" style="width:56px;height:56px;font-size:20px">${held(p) ? esc(held(p)) : "?"}</div>
      <dl class="kv" style="margin:0;flex:1">
        <dt>CYO</dt><dd>${p.registered ? '<span class="dot-ok">Registered</span>' : '<span class="dot-no">Not registered</span>'}</dd>
        <dt>Uniform</dt><dd>${uni}</dd>
        <dt>Jersey</dt><dd>${v("topSize", x => SIZE[x])}</dd>
        <dt>Shorts</dt><dd>${p.shortSize ? (p.shortLength ? esc(p.shortLength) + '" ' : "") + SIZE[p.shortSize] : "–"}</dd>
        <dt>Availability</dt><dd>${answered} of ${d.games.length} answered</dd>
        <dt>Cell</dt><dd>${esc(phone(p.phone) || "–")}</dd>
      </dl></div></section>`;
  }).join("");
  const sched = `<section class="card"><div class="hd"><h2>Schedule</h2><button class="btn sm ghost" data-tab="schedule">Details</button></div>
    ${games.length ? games.map(g => { const c = counts(d, g); return `<div class="mini-game">${dateTile(g.date)}<div style="min-width:0"><b style="font-size:14px">${esc(fmt(g.date, { weekday: "short" }))}${g.kind === "tournament" ? ' <span class="pill blue">Tourney</span>' : ""}</b><div class="muted" style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(where(g))}</div><div class="cts"><span class="dot-ok">${c.yes} in</span> · ${c.maybe} maybe · <span class="dot-no">${c.no} out</span></div></div><div style="display:flex;flex-direction:column;gap:4px">${d.mine.map(p => seg(p.id, g.date, (p.avail || {})[g.date] || "")).join("")}</div></div>`; }).join("") : '<p class="empty">No upcoming games.</p>'}</section>`;
  const chat = `<section class="card chatcard"><div class="hd"><h2>Team chat</h2><span class="muted small">${d.count} players</span></div>
    <div class="chatbox" id="chatList"></div>
    <form id="chatForm"><label for="chatText" style="position:absolute;left:-9999px">Message</label><textarea id="chatText" rows="1" placeholder="Message the team" maxlength="1000"></textarea><button class="btn" type="submit">Send</button></form></section>`;
  return head("Hi, " + first(String(d.me.name).replace(/^Coach /, "")), "Hawklets · Rockhurst freshmen CYO",
      `<button class="iconbtn" data-act="logout" aria-label="Sign out">${svg("out")}</button>`) +
    `<div class="dash"><div class="col">${VIEW.homeMain(d, true)}</div><div class="col">${mine}${sched}</div><div class="col">${chat}</div></div>`;
}

/* ---------- coach views ---------- */
const COACH = {
overview(d) {
  const ps = d.adminPlayers.filter(p => p.status !== "declined"), gs = d.games, t = todayISO(), next = gs.find(g => g.date >= t);
  const team = ps.filter(p => p.status === "committed"), n = team.length;
  const paidSum = team.reduce((a, p) => a + Number(p.paid || 0), 0);
  const uniOf = p => p.needsUniform === "no" ? "Has one" : p.uniformOrdered ? "Ordered" : p.needsUniform === "yes" ? "To order" : "–";
  const inCount = p => Object.values(p.avail || {}).filter(v => v === "yes").length;
  const cols = [
    ["jersey", "#", p => held(p) === "" ? 999 : +held(p)],
    ["name", "Player", p => p.name],
    ["registered", "CYO", p => p.registered ? 1 : 0],
    ["parent1", "Parent", p => [p.parent1, p.parent2].filter(Boolean).join(" & ")],
    ["phone", "Cell", p => phone(p.phone)],
    ["topSize", "Jersey", p => SIZE[p.topSize] || ""],
    ["shortSize", "Shorts", p => p.shortSize ? (p.shortLength ? p.shortLength + '" ' : "") + SIZE[p.shortSize] : ""],
    ["uniform", "Uniform", uniOf],
    ["avail", "Avail", p => Object.keys(p.avail || {}).length],
    ["in", "In", inCount],
    ["next", next ? "Next " + fmt(next.date, { month: "numeric", day: "numeric" }) : "Next", p => next ? ((p.avail || {})[next.date] || "") : ""],
    ["paid", "Paid", p => Number(p.paid || 0)],
    ["formAt", "Info saved", p => p.formAt || ""]
  ];
  const col = cols.find(c => c[0] === S.sort.k) || cols[0];
  const rows = ps.slice().sort((a, b) => { const x = col[2](a), y = col[2](b); return (x > y ? 1 : x < y ? -1 : a.name.localeCompare(b.name)) * S.sort.dir; });
  const cellOf = (c, p) => {
    const v = c[2](p);
    if (c[0] === "jersey") return `<td class="num-c">${patch(held(p), "xs")}</td>`;
    if (c[0] === "name") return `<td><b>${esc(p.name)}</b>${p.status && p.status !== "committed" ? ` <span class="pill">${esc(p.status)}</span>` : ""}</td>`;
    if (c[0] === "registered") return `<td>${p.registered ? `<span class="dot-ok" aria-label="Yes">${svg("check", 3)}</span>` : '<span class="dot-no">No</span>'}</td>`;
    if (c[0] === "uniform") return `<td>${v === "To order" ? '<span style="color:var(--amber);font-weight:700">To order</span>' : v === "–" ? '<span class="dot-q">–</span>' : '<span class="dot-ok">' + v + "</span>"}</td>`;
    if (c[0] === "avail") return `<td>${v}/${gs.length}</td>`;
    if (c[0] === "next") return `<td>${v ? `<span class="c ${v}">${AV[v][0]}</span>` : '<span class="dot-q">·</span>'}</td>`;
    if (c[0] === "paid") return `<td>${d.share && v >= d.share ? '<span class="dot-ok">' + usd(v) + "</span>" : v ? usd(v) : '<span class="dot-q">$0</span>'}</td>`;
    if (c[0] === "formAt") return `<td>${v ? esc(fmt(v, { month: "short", day: "numeric" })) : '<span class="dot-q">–</span>'}</td>`;
    if (c[0] === "parent1") return `<td class="trunc" title="${esc(v)}">${v === "" ? '<span class="dot-q">–</span>' : esc(v)}</td>`;
    return `<td>${v === "" ? '<span class="dot-q">–</span>' : esc(v)}</td>`;
  };
  const stat = (b, s) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`;
  return `<div class="stats auto">
      ${stat(n, "Committed")}
      ${stat(team.filter(p => p.registered).length + "/" + n, "On CYO roster")}
      ${stat(team.filter(p => held(p)).length + "/" + n, "Numbers claimed")}
      ${stat(team.filter(p => p.needsUniform === "no" || p.uniformOrdered).length + "/" + n, "Uniforms done")}
      ${stat(team.filter(p => p.topSize || p.needsUniform === "no").length + "/" + n, "Sizes sent")}
      ${stat(team.filter(p => Object.keys(p.avail || {}).length).length + "/" + n, "Answered availability")}
      ${stat(next ? counts(d, next).yes : "–", next ? "In for " + esc(fmt(next.date, { month: "short", day: "numeric" })) : "Next game")}
      ${stat(usd(paidSum), "Collected")}
    </div>
    <section class="card"><div class="hd"><h2>All players</h2><div class="row" style="gap:8px">
      <button class="btn sm ghost" data-act="copy" data-v="${esc(team.flatMap(p => [p.email1, p.email2].filter(Boolean)).join(", "))}">${svg("copy")}Parent emails</button>
      <button class="btn sm" data-act="editp">${svg("plus")}Add</button></div></div>
    <div class="scroll"><table class="tbl"><thead><tr>${cols.map(c => `<th><button data-act="sort" data-id="${c[0]}" class="${S.sort.k === c[0] ? "on" : ""}">${esc(c[1])}${S.sort.k === c[0] ? (S.sort.dir > 0 ? " ↑" : " ↓") : ""}</button></th>`).join("")}<th></th></tr></thead>
    <tbody>${rows.map(p => `<tr>${cols.map(c => cellOf(c, p)).join("")}<td><button class="btn sm ghost" data-act="editp" data-id="${esc(p.id)}">Edit</button></td></tr>`).join("")}</tbody></table></div>
    <p class="muted small" style="margin-top:10px">Click a column to sort. Avail = Saturdays answered; In = Saturdays marked in.</p></section>`;
},
uniforms(d) {
  const ps = d.adminPlayers.filter(p => p.status === "committed").sort((a, b) => a.name.localeCompare(b.name));
  const by = {}; ps.forEach(p => { if (p.jersey) (by[p.jersey] = by[p.jersey] || []).push(p.name); });
  const tot = {}; ps.forEach(p => { if (p.needsUniform === "yes") { if (p.topSize) tot["Jersey " + SIZE[p.topSize]] = (tot["Jersey " + SIZE[p.topSize]] || 0) + 1; if (p.shortSize) { const k = `Shorts ${p.shortLength ? p.shortLength + '" ' : ""}${SIZE[p.shortSize]}`; tot[k] = (tot[k] || 0) + 1; } } });
  const assigned = ps.filter(p => p.jersey).length, ordered = ps.filter(p => p.uniformOrdered || p.needsUniform === "no").length;
  return `<div class="stats"><div class="stat"><b>${assigned}/${ps.length}</b><span>Numbers claimed</span></div><div class="stat"><b>${ps.filter(p => p.topSize || p.needsUniform === "no").length}/${ps.length}</b><span>Sizes sent</span></div><div class="stat"><b>${ordered}/${ps.length}</b><span>Uniform done</span></div></div>
    <section class="card"><div class="hd"><h2>Jersey numbers</h2></div>
    <p class="muted small" style="margin-bottom:12px">Families claim numbers first come, first served. You can change any number here; it saves instantly and taken numbers are greyed out.</p>
    <div class="list">${ps.map(p => {
      const dup = p.jersey && by[p.jersey].length > 1;
      return `<div class="li"><div class="grow"><h3>${esc(p.name)}</h3><p>${p.topSize ? `Jersey ${esc(SIZE[p.topSize])}` : "No sizes yet"}${p.shortSize ? ` / ${p.shortLength ? esc(p.shortLength) + '" ' : ""}${esc(SIZE[p.shortSize])}` : ""}</p>
        <div class="row wrap" style="gap:6px;margin-top:6px">${uniPill(p)}${dup ? '<span class="pill red">Duplicate number</span>' : ""}<span class="saved" id="sv_${esc(p.id)}" hidden>${svg("check", 3)}Saved</span></div></div>
        <select class="mini" data-act="jersey" data-id="${esc(p.id)}" aria-label="Number for ${esc(p.name)}"><option value="">–</option>${LEGAL.map(n => { const o = by[n] && !by[n].includes(p.name) ? by[n][0] : ""; return `<option value="${n}"${String(p.jersey) === n ? " selected" : ""}${o ? " disabled" : ""}>${n}${o ? " · " + esc(first(o)) : ""}</option>`; }).join("")}</select></div>`;
    }).join("")}</div></section>
    ${Object.keys(tot).length ? `<section class="card"><div class="hd"><h2>Sizes to order</h2></div><div class="chips">${Object.keys(tot).sort().map(k => `<span class="pill blue" style="font-size:13px;padding:6px 12px">${esc(k)} × ${tot[k]}</span>`).join("")}</div></section>` : ""}`;
},
roster(d) {
  const ps = d.adminPlayers.slice().sort((a, b) => a.name.localeCompare(b.name));
  const em = f => ps.filter(f).flatMap(p => [p.email1, p.email2].filter(Boolean)).join(", ");
  return `<section class="card"><div class="hd"><h2>${ps.filter(p => p.status === "committed").length} players</h2><button class="btn sm" data-act="editp">${svg("plus")}Add</button></div>
    <div class="row wrap" style="gap:8px;margin-bottom:16px">
      <button class="btn sm ghost" data-act="copy" data-v="${esc(em(p => p.status === "committed"))}">${svg("copy")}All parent emails</button>
      <button class="btn sm ghost" data-act="copy" data-v="${esc(em(p => p.status === "committed" && !p.registered))}">${svg("copy")}Not on CYO</button>
      <button class="btn sm ghost" data-act="copy" data-v="${esc(ps.filter(p => p.status === "committed" && p.studentEmail).map(p => p.studentEmail).join(", "))}">${svg("copy")}Student emails</button></div>
    <div class="list">${ps.map(p => `<div class="li"><div class="jn${p.jersey ? "" : " none"}">${p.jersey ? esc(p.jersey) : "–"}</div><div class="grow"><h3>${esc(p.name)}</h3><p style="overflow:hidden;text-overflow:ellipsis">${esc([p.parent1, p.parent2].filter(Boolean).join(" & "))}${p.phone ? " · " + esc(p.phone) : ""}</p>
      <div class="row wrap" style="gap:6px;margin-top:6px"><span class="pill ${p.status === "committed" ? "green" : p.status === "declined" ? "red" : ""}">${esc(p.status)}</span>${p.registered ? '<span class="pill green">On CYO</span>' : '<span class="pill red">Not on CYO</span>'}${p.formAt ? "" : '<span class="pill amber">No info yet</span>'}</div></div>
      <button class="btn sm ghost" data-act="editp" data-id="${esc(p.id)}">Edit</button></div>`).join("")}</div></section>`;

avail(d) {
  const gs = d.games, ps = d.adminPlayers.filter(p => p.status === "committed");
  return `<section class="card"><div class="hd"><h2>Availability</h2></div><div class="scroll"><table><thead><tr><th>Player</th>${gs.map(g => `<th>${esc(fmt(g.date, { month: "numeric", day: "numeric" }))}</th>`).join("")}</tr></thead><tbody>
    ${ps.map(p => `<tr><td>${esc(p.name)}</td>${gs.map(g => { const v = (p.avail || {})[g.date]; return `<td><span class="c ${v || "none"}">${v ? AV[v][0] : "·"}</span></td>`; }).join("")}</tr>`).join("")}
    <tr><td>In</td>${gs.map(g => { const c = counts(d, g).yes; return `<td><b style="color:var(--${c >= 5 ? "green" : "red"})">${c}</b></td>`; }).join("")}</tr></tbody></table></div>
    <p class="muted small" style="margin-top:12px">I = in, M = maybe, O = out. CYO needs 5 players to start a game.</p></section>`;
},
money(d) {

    <section class="card"><div class="list">${ps.map(p => { const paid = Number(p.paid || 0), done = d.share && paid >= d.share;

},
games(d) {
  return `<section class="card"><div class="hd"><h2>Games</h2><button class="btn sm" data-act="editg">${svg("plus")}Add</button></div><div class="list">${d.games.map(g =>

},
news(d) {

    <div class="field"><label class="lab" for="nwT">Title</label><input id="nwT" name="title" maxlength="120" required></div>
    <div class="field"><label class="lab" for="nwB">Message</label><textarea id="nwB" name="body" maxlength="3000" required></textarea></div>
    <button class="btn block" type="submit" style="margin-top:18px">Post to everyone's Home screen</button></form></section>
    <section class="card"><div class="hd"><h2>Posted</h2></div><div class="list">${d.announcements.length ? d.announcements.map(a =>
      `<div class="li"><div class="grow"><h3>${esc(a.title)}</h3><p>${esc(fmt(String(a.ts).slice(0, 10)))}</p></div><button class="btn sm danger" data-act="delnews" data-id="${esc(a.id)}">Delete</button></div>`).join("") : '<p class="empty">Nothing posted yet.</p>'}</div></section>`;
},
settings(d) {
  const s = d.adminSettings, f = [["teamPassword", "Team password"], ["coach", "Coach name"], ["coachEmail", "Coach email"], ["coachPhone", "Coach cell (for texts)"], ["assistant", "Assistant coach"],
    ["feeReady", "Show the team fee to families", [["", "Not yet"], ["yes", "Yes, show it"]]], ["teamFee", "Team fee ($)"], ["roundTo", "Round each share up to ($)"], ["payDue", "Payment due", "date"], ["venmo", "Venmo"], ["checkPayee", "Checks payable to"],
    ["uniformLink", "Uniform store link"], ["uniformDue", "Uniform order deadline", "date"], ["cyoLink", "CYO league page"], ["admins", "Coach logins (emails, comma separated)"]];
  return `<section class="card"><form id="setForm" novalidate>${f.map(x => `<div class="field"><label class="lab" for="st_${x[0]}">${x[1]}</label>${Array.isArray(x[2])
      ? `<select id="st_${x[0]}" name="${x[0]}">${x[2].map(o => `<option value="${o[0]}"${(s[x[0]] || "") === o[0] ? " selected" : ""}>${o[1]}</option>`).join("")}</select>`
      : `<input id="st_${x[0]}" name="${x[0]}" ${x[2] ? `type="${x[2]}"` : ""} value="${esc(s[x[0]])}">`}</div>`).join("")}
    <button class="btn block" type="submit" style="margin-top:20px">Save settings</button>
    <p class="muted small" style="margin-top:10px">Changing the password doesn't sign anyone out. New sign-ins need the new one.</p></form></section>`;
}
};

/* ---------- chat ---------- */
function composer() {
  return `<div class="composer"><form id="chatForm"><label for="chatText" class="sr" style="position:absolute;left:-9999px">Message</label><textarea id="chatText" rows="1" placeholder="Message the team" maxlength="1000"></textarea><button class="btn" type="submit">Send</button></form></div>`;
}
function renderChat(keep) {
  const el = $("chatList"); if (!el) return;
  const box = el.classList.contains("chatbox");
  const nearBottom = box ? el.scrollTop + el.clientHeight >= el.scrollHeight - 80 : window.innerHeight + window.scrollY >= document.body.scrollHeight - 120;
  const me = S.data.me.email, admin = S.data.me.admin;
  el.innerHTML = S.data.messages.length ? S.data.messages.map(m => {
    const mine = String(m.email).toLowerCase() === me;
    return `<div class="msg${mine ? " me" : ""}"><div class="bub">${esc(m.text)}</div><div class="meta">${mine ? "" : esc(m.name) + " · "}${esc(new Date(m.ts).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))}${admin ? ` · <a href="#" data-act="delmsg" data-id="${esc(m.id)}">Delete</a>` : ""}</div></div>`;
  }).join("") : (box ? '<p class="empty">No messages yet. Say hi to the team.</p>' : `<section class="card"><p class="empty">No messages yet. Say hi to the team.</p></section>`);
  if (!keep || nearBottom) { if (box) el.scrollTop = el.scrollHeight; else window.scrollTo(0, document.body.scrollHeight); }
}

/* ---------- save bar (My player) ---------- */
function saveBar() {
  return `<div class="savebar"><div class="in"><span class="grow">Unsaved changes</span><button class="btn ghost sm" data-act="discard">Discard</button><button class="btn sm" data-act="save" id="saveBtn">Save changes</button></div></div>`;
}
function draft(pid, k, v, quiet) {
  const p = D().mine.find(x => x.id === pid), cur = Object.assign({}, S.drafts[pid] || {});
  cur[k] = v;
  if (k === "shortLength" && v === "9" && /^Y/.test((S.drafts[pid] || {}).shortSize || p.shortSize || "")) cur.shortSize = "";
  Object.keys(cur).forEach(key => { if (String(cur[key] ?? "") === String((key === "jersey1" ? held(p) : p[key]) ?? "") && !(key === "uniformOrdered" && !!cur[key] !== !!p[key])) delete cur[key]; });
  if (Object.keys(cur).length) S.drafts[pid] = cur; else delete S.drafts[pid];
  if (!quiet) return render(true);
  /* typing: keep focus, just show or hide the save bar */
  const bar = document.querySelector(".savebar");
  if (dirty() && !bar) $("app").insertAdjacentHTML("beforeend", saveBar());
  else if (!dirty() && bar) bar.remove();
}
async function saveDrafts() {
  const btn = $("saveBtn"); if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  try {
    for (const pid of Object.keys(S.drafts)) {
      const saved = await api("savePlayerInfo", S.token, pid, S.drafts[pid]);
      const i = D().mine.findIndex(x => x.id === pid);
      D().mine[i] = Object.assign({}, D().mine[i], saved);
      delete S.drafts[pid];
    }
    toast("Saved");
    load(true);
  } catch (e) {
    /* someone else claimed the number first: drop it from the draft so it shows as taken */
    if (/just taken/.test(e.message)) Object.keys(S.drafts).forEach(pid => { delete S.drafts[pid].jersey1; if (!Object.keys(S.drafts[pid]).length) delete S.drafts[pid]; });
    fail(e); load(true);
  }
}

/* ---------- sheet (dialog) ---------- */
function sheet(title, fields, vals, onSave, onDelete) {
  S.sheetOpen = true;
  $("sheet").innerHTML = `<div class="scrim" id="scrim"><form class="sheet" id="sheetForm" novalidate role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><h2>${esc(title)}</h2>
    <div class="grid2">${fields.map(f => {
      const v = vals[f[0]] == null ? "" : vals[f[0]];
      const ctl = Array.isArray(f[2]) ? `<select id="sf_${f[0]}" name="${f[0]}">${f[2].map(o => `<option value="${esc(o[0])}"${String(v) === String(o[0]) ? " selected" : ""}>${esc(o[1])}</option>`).join("")}</select>`
        : `<input id="sf_${f[0]}" name="${f[0]}" ${f[2] ? `type="${f[2]}"` : ""} value="${esc(v)}">`;
      return `<div class="field ${f[3] ? "full" : ""}" style="margin:0"><label class="lab" for="sf_${f[0]}">${esc(f[1])}</label>${ctl}</div>`;
    }).join("")}</div>
    <div class="row" style="margin-top:22px;gap:10px">${onDelete ? `<button type="button" class="btn danger" id="sfDel">Delete</button>` : ""}<span class="grow"></span><button type="button" class="btn ghost" id="sfX">Cancel</button><button class="btn" type="submit">Save</button></div></form></div>`;
  const close = () => { S.sheetOpen = false; $("sheet").innerHTML = ""; };
  $("sfX").onclick = close;
  $("scrim").onclick = e => { if (e.target.id === "scrim") close(); };
  if (onDelete) $("sfDel").onclick = function () { if (this.dataset.sure) { onDelete(); close(); } else { this.dataset.sure = 1; this.textContent = "Tap to confirm"; } };
  $("sheetForm").onsubmit = e => { e.preventDefault(); const out = {}; fields.forEach(f => out[f[0]] = e.target.elements[f[0]].value.trim()); onSave(out); close(); };
  setTimeout(() => { const i = $("sheetForm").querySelector("input,select"); if (i && window.innerWidth > 640) i.focus(); }, 50);
}
const adminPlayer = id => (D().adminPlayers || []).find(p => p.id === id);
async function savePlayer(p, msg) {
  try { await api("adminSavePlayer", S.token, p); toast(msg || "Saved"); await load(true); } catch (e) { fail(e); }
}

/* ============ events ============ */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-act]"); if (!t || t.closest("#sheet form") && !t.dataset.act) return;
  if (t.dataset.tab) {
    e.preventDefault();
    if (dirty() && t.dataset.tab !== S.tab && !confirm("You have unsaved changes. Leave without saving?")) return;
    if (t.dataset.tab !== S.tab) S.drafts = {};
    S.tab = t.dataset.tab; if (S.tab === "chat") markSeen(); render(); window.scrollTo(0, S.tab === "chat" ? document.body.scrollHeight : 0); return;
  }
  const a = t.dataset.act, id = t.dataset.id, pid = t.dataset.pid;
  if (a === "logout") { if (confirm("Sign out of the team app?")) logout(); }
  else if (a === "ctab") { S.ctab = id; render(); window.scrollTo(0, 0); }
  else if (a === "sort") { S.sort = { k: id, dir: S.sort.k === id ? -S.sort.dir : 1 }; render(true); }
  else if (a === "pick") {
    const p = D().mine.find(x => x.id === pid), n = t.dataset.n;
    if (t.disabled) return;
    const cur = (S.drafts[pid] || {}).jersey1 !== undefined ? S.drafts[pid].jersey1 : held(p);
    draft(pid, "jersey1", cur === n ? "" : n);
  }
  else if (a === "set") { const p = D().mine.find(x => x.id === pid), v = Object.assign({}, p, S.drafts[pid] || {}); draft(pid, t.dataset.k, v[t.dataset.k] === t.dataset.v ? "" : t.dataset.v); }
  else if (a === "save") saveDrafts();
  else if (a === "discard") { S.drafts = {}; render(true); }
  else if (a === "avail") {
    const d = D(), p = d.mine.find(x => x.id === pid), cur = (p.avail || {})[t.dataset.date] || "", v = cur === t.dataset.v ? "" : t.dataset.v;
    p.avail = Object.assign({}, p.avail); if (v) p.avail[t.dataset.date] = v; else delete p.avail[t.dataset.date];
    const pub = d.players.find(x => x.id === pid); if (pub) pub.avail = p.avail;
    render(true);
    try { await api("setAvailability", S.token, pid, t.dataset.date, v); toast(v ? `Saved: ${AV[v]} for ${fmt(t.dataset.date)}` : "Answer cleared"); }
    catch (er) { fail(er); load(true); }
  }
  else if (a === "copy") {
    const v = t.dataset.v; if (!v) { toast("No emails in that group", true); return; }
    try { await navigator.clipboard.writeText(v); toast(`Copied ${v.split(",").length} emails`); } catch (er) { prompt("Copy these emails:", v); }
  }
  else if (a === "paid") { savePlayer({ id, paid: t.dataset.v }, Number(t.dataset.v) ? "Marked paid" : "Payment cleared"); }
  else if (a === "editp") {
    const p = id ? adminPlayer(id) : { status: "committed", registered: false };
    sheet(id ? "Edit player" : "Add player", [["name", "Player name", "", 1], ["status", "Status", [["committed", "Committed"], ["maybe", "Maybe"], ["declined", "Declined"]]], ["registered", "On CYO roster", [["false", "No"], ["true", "Yes"]]],
      ["parent1", "Parent"], ["email1", "Parent email", "email"], ["parent2", "Second parent"], ["email2", "Second email", "email"], ["phone", "Parent cell", "tel"], ["studentEmail", "Student email", "email"], ["notes", "Notes", "", 1]],
      Object.assign({}, p, { registered: String(!!p.registered) }),
      v => { if (!v.name) { toast("Add a player name", true); return; } v.id = id || ""; savePlayer(v); },
      id ? async () => { try { await api("adminDelete", S.token, "player", id); toast("Player removed"); load(true); } catch (er) { fail(er); } } : null);
  }
  else if (a === "editg") {
    const g = id ? D().games.find(x => x.id === id) : { kind: "game" };
    sheet(id ? "Edit game" : "Add game", [["date", "Date", "date"], ["kind", "Type", [["game", "League game"], ["tournament", "Tournament"]]], ["time", "Time"], ["location", "Gym"], ["opponent", "Opponent"], ["note", "Note", "", 1]], g,
      async v => { v.id = id || ""; try { await api("adminSaveGame", S.token, v); toast("Game saved"); load(true); } catch (er) { fail(er); } },
      id ? async () => { try { await api("adminDelete", S.token, "game", id); toast("Game deleted"); load(true); } catch (er) { fail(er); } } : null);
  }
  else if (a === "delnews") { if (!confirm("Delete this update?")) return; try { await api("adminDelete", S.token, "news", id); toast("Deleted"); load(true); } catch (er) { fail(er); } }
  else if (a === "delmsg") { e.preventDefault(); if (!confirm("Delete this message for everyone?")) return; try { await api("adminDelete", S.token, "msg", id); S.data.messages = S.data.messages.filter(m => m.id !== id); renderChat(true); toast("Deleted"); } catch (er) { fail(er); } }
});

document.addEventListener("change", async e => {
  const t = e.target, a = t.dataset.act;
  if (a === "ordered") draft(t.dataset.pid, "uniformOrdered", t.checked);
  else if (a === "jersey") {
    const id = t.dataset.id, mark = $("sv_" + id);
    t.disabled = true;
    try {
      await api("adminSavePlayer", S.token, { id, jersey: t.value });
      const p = adminPlayer(id); p.jersey = t.value; const pub = D().players.find(x => x.id === id); if (pub) pub.jersey = t.value;
      if (mark) { mark.hidden = false; setTimeout(() => mark.hidden = true, 2500); }
      toast(t.value ? `#${t.value} saved for ${first(p.name)}` : `Number cleared for ${first(p.name)}`);
      setTimeout(() => render(true), 900);
    } catch (er) { fail(er); load(true); }
    finally { t.disabled = false; }
  }
});
document.addEventListener("input", e => { if (e.target.dataset.act === "phone") draft(e.target.dataset.pid, "phone", e.target.value.trim(), true); }, { passive: true });

document.addEventListener("submit", async e => {
  const f = e.target; e.preventDefault();
  if (f.id === "loginForm") {
    const b = f.querySelector("button"), er = $("lgErr"); b.disabled = true; b.textContent = "Signing in…"; er.hidden = true;
    try { S.token = await api("login", $("lgEmail").value, $("lgPw").value); store.set("cyoToken", S.token); S.tab = "home"; render(); await load(); }
    catch (x) { er.textContent = x.message; er.hidden = false; b.disabled = false; b.textContent = "Sign in"; }
  }
  else if (f.id === "chatForm") {
    const ta = $("chatText"), txt = ta.value.trim(); if (!txt) return; ta.value = "";
    try { const m = await api("postMessage", S.token, txt); S.data.messages.push(m); S.lastMsg = m.ts; markSeen(); renderChat(false); }
    catch (x) { ta.value = txt; fail(x); }
  }
  else if (f.id === "newsForm") {
    const title = f.elements.title.value.trim(), body = f.elements.body.value.trim();
    if (!title || !body) { toast("Add a title and a message", true); return; }
    try { await api("adminPostAnnouncement", S.token, { title, body }); toast("Posted"); f.reset(); load(true); } catch (x) { fail(x); }
  }
  else if (f.id === "setForm") {
    const o = {}; [...f.elements].forEach(x => { if (x.name) o[x.name] = x.value.trim(); });
    try { await api("adminSaveSettings", S.token, o); toast("Settings saved"); load(true); } catch (x) { fail(x); }
  }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "chatText" && e.key === "Enter" && !e.shiftKey && window.innerWidth > 640) { e.preventDefault(); $("chatForm").requestSubmit(); }
  if (e.key === "Escape" && S.sheetOpen) $("sfX").click();
});

render(); load();
</script>
</body>
</html>
