<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#173f7a">
<title>Hawklets CYO Basketball</title>
<style>
:root{
  --bg:#eef2f8;--card:#fff;--ink:#0f172a;--muted:#475467;--line:#d6dde8;
  --navy:#173f7a;--blue:#1f4e94;--soft:#e6eefa;
  --good:#11643a;--goodbg:#e1f4e8;--warn:#7a4a00;--warnbg:#fdefd3;--bad:#a3191b;--badbg:#fbe3e3;
  --r:14px;--safe:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
h1{font-size:20px;line-height:1.2}
h2{font-size:19px;line-height:1.25}
h3{font-size:16px;line-height:1.3}
a{color:var(--blue)}
button{font:inherit}
:focus-visible{outline:3px solid #f5b400;outline-offset:2px}

/* top bar */
.top{background:var(--navy);color:#fff;padding:14px 16px 16px;padding-top:max(14px,env(safe-area-inset-top))}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:#fff;color:var(--navy);display:grid;place-items:center;font:800 15px system-ui;flex:none}
.top p{font-size:14px;opacity:.9}
.top .grow{flex:1;min-width:0}

/* layout */
main{max-width:760px;margin:0 auto;padding:16px 14px calc(96px + var(--safe));display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.sub{color:var(--muted);font-size:15px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--blue)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:2px}

/* hero */
.hero{background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;border:0}
.hero .kicker{color:#cfe0ff}
.hero .date{font-size:30px;font-weight:800;line-height:1.1}
.hero .sub{color:#dbe6fb}
.meter{height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.meter i{display:block;height:100%;background:#fff;border-radius:99px}

/* quick actions */
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:650;font-size:14px;text-align:center;cursor:pointer}
.act svg{width:26px;height:26px;color:var(--blue)}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.when{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--soft);color:var(--blue);padding:6px 0;line-height:1.1}
.when b{display:block;font-size:20px}
.when span{font-size:12px;font-weight:700}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--blue);white-space:nowrap}
.good{background:var(--goodbg);color:var(--good)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}
.num{flex:none;width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800}
.num.empty{background:var(--soft);color:var(--muted)}

/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}

/* forms */
label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:15px}
input,select,textarea{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:48px;width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;border:0;border-radius:12px;padding:13px 18px;background:var(--blue);color:#fff;cursor:pointer;min-height:50px;text-decoration:none}
.btn svg{width:20px;height:20px}
.btn.ghost{background:var(--soft);color:var(--blue)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);flex:0 0 216px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{position:relative;display:block;font-weight:600;border-left:1px solid var(--line)}
.seg label:first-child{border-left:0}
.seg input{position:absolute;inset:0;opacity:0;margin:0;min-height:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:10px 0}
.seg input:checked+span{background:var(--blue);color:#fff}
.seg input:focus-visible+span{outline:3px solid #f5b400;outline-offset:-3px}
.err{color:var(--bad);font-weight:600}

/* bottom tab bar on phones, top bar on wide screens */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe));display:flex;justify-content:center}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:560px}
.tabs button{background:none;border:0;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:650;color:var(--muted);cursor:pointer;min-height:54px}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current=page]{color:var(--blue);background:var(--soft)}

/* lock screen */
.lock{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--blue),var(--navy))}
.lock .card{width:100%;max-width:400px}
.lock .logo{width:56px;height:56px;font-size:19px;background:var(--navy);color:#fff}

@media (max-width:520px){.grid,.btns{grid-template-columns:1fr}.hero .date{font-size:26px}}
@media (min-width:900px){
  .tabs{top:0;bottom:auto;position:sticky;border-top:0;border-bottom:1px solid var(--line);padding:6px}
  .tabs button{flex-direction:row;justify-content:center;gap:8px;font-size:15px;min-height:44px}
  .tabs svg{width:20px;height:20px}
  main{padding-bottom:48px}
}
</style>
</head>
<body>
<div class="lock" id="lock">
  <form class="card" id="lockForm">
    <div class="logo">RH</div>
    <h1>Hawklets CYO Basketball</h1>
    <p class="sub">Rockhurst freshmen, winter 2026-27. Enter the team password from Coach Travis.</p>
    <label>Team password<input id="pw" type="password" autocomplete="current-password" required></label>
    <p class="err" id="lockErr" role="alert"></p>
    <button class="btn" type="submit">Open team page</button>
  </form>
</div>
<div id="app" hidden></div>
<script>
"use strict";
var D, TAB = "home", $ = function (id) { return document.getElementById(id); };
var LEGAL = ["0","1","2","3","4","5","10","11","12","13","14","15","20","21","22","23","24","25","30","31","32","33","34","35","40","41","42","43","44","45","50","51","52","53","54","55"];
var SIZES = ["Youth Large","Youth X-Large","Adult Small","Adult Medium","Adult Large","Adult X-Large","Adult 2X-Large","Adult 3X-Large"];
var AV = { yes: "In", maybe: "Maybe", no: "Out" };
var ICON = {
  home: '<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',
  schedule: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  team: '<circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M2 20c1-3 3-5 6-5s5 2 6 5M10 20c1-3 3-5 6-5s5 2 6 5"/>',
  uniform: '<path d="M8 3l-5 3 2 5 3-1v11h8V10l3 1 2-5-5-3c0 2-2 3-4 3s-4-1-4-3z"/>',
  update: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>',
  text: '<path d="M4 5h16v11H8l-4 4z"/>',
  phone: '<path d="M5 3h4l2 5-3 2a12 12 0 006 6l2-3 5 2v4a2 2 0 01-2 2A17 17 0 013 5a2 2 0 012-2z"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'
};
var TABS = [["home", "Home"], ["schedule", "Schedule"], ["team", "Team"], ["uniform", "Uniform"], ["update", "Update"]];
var svg = function (k) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">' + ICON[k] + '</svg>'; };
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
var dt = function (d) { return new Date(d + "T12:00:00"); };
var day = function (d, o) { return dt(d).toLocaleDateString("en-US", o || { weekday: "short", month: "short", day: "numeric" }); };
var today = new Date().toLocaleDateString("en-CA");
var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
var tel = function (p) { return String(p).replace(/\D/g, ""); };

/* ---------- unlock: data.enc is AES-GCM encrypted with a key derived from the team password ---------- */
async function unlock(pw) {
  var e = await (await fetch("data.enc", { cache: "no-store" })).json();
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(e.salt), iterations: e.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(e.iv) }, key, b64(e.ct))));
}
async function openApp(pw) {
  D = await unlock(pw);
  localStorage.setItem("teamPw", pw);
  $("lock").hidden = true; $("app").hidden = false; render();
}
$("lockForm").onsubmit = function (ev) {
  ev.preventDefault(); $("lockErr").textContent = "";
  openApp($("pw").value.trim()).catch(function () { $("lockErr").textContent = "That password didn't work. Check Coach Travis's email."; });
};
if (localStorage.getItem("teamPw")) openApp(localStorage.getItem("teamPw")).catch(function () { localStorage.removeItem("teamPw"); });

/* ---------- pieces ---------- */
function where(g) { return [g.time, g.location, g.opponent && "vs " + g.opponent].filter(Boolean).join(" · ") || "Time and gym post about a week ahead"; }
function inCount(g) { return D.players.filter(function (p) { return p.avail[g.date] === "yes"; }).length; }
function whenBox(d) { return '<div class="when"><span>' + esc(day(d, { month: "short" })) + '</span><b>' + dt(d).getDate() + '</b></div>'; }
function uniPill(u) { return { has: '<span class="pill good">Has uniform</span>', ordered: '<span class="pill good">Uniform ordered</span>', needs: '<span class="pill warn">Uniform to order</span>' }[u] || '<span class="pill">Uniform not sent</span>'; }
function contactCard() {
  var t = D.team;
  return '<section class="card"><h2>Contact Coach Travis</h2><p class="sub">Text is fastest, especially on game days.</p><div class="btns">' +
    '<a class="btn" href="sms:' + tel(t.coachPhone) + '">' + svg("text") + 'Text ' + esc(t.coachPhone) + '</a>' +
    '<a class="btn ghost" href="tel:' + tel(t.coachPhone) + '">' + svg("phone") + 'Call</a>' +
    '<a class="btn ghost" style="grid-column:1/-1" href="mailto:' + esc(t.coachEmail) + '">' + svg("mail") + esc(t.coachEmail) + '</a></div>' +
    (t.assistant ? '<p class="sub">Assistant coach: ' + esc(t.assistant) + '</p>' : "") + '</section>';
}

/* ---------- views ---------- */
var VIEWS = {
  home: function () {
    var t = D.team, next = D.games.filter(function (g) { return g.date >= today; })[0];
    var todo = [
      ["2026-11-19", "Send numbers, sizes and availability", 'Use the <a href="#" data-go="update">Update</a> tab.'],
      ["2026-11-20", "Coach confirms jersey numbers", "They'll show on the Team tab."],
      [t.uniformDue, "Order the uniform", 'After your number is confirmed. <a href="#" data-go="uniform">How to order</a>'],
      [t.feeDue, "Pay the $" + t.fee + " team fee", "Venmo " + esc(t.venmo) + " or a check to " + esc(t.checkPayee) + ", with your son's name."]
    ].filter(function (x) { return x[0] >= today; });
    var hero = next ? '<section class="card hero"><span class="kicker">' + (next.kind === "tournament" ? "TOURNAMENT GAME" : "NEXT GAME") + '</span>' +
      '<p class="date">' + esc(day(next.date, { weekday: "long", month: "long", day: "numeric" })) + '</p><p class="sub">' + esc(where(next)) + '</p>' +
      '<div class="meter" aria-hidden="true"><i style="width:' + Math.round(inCount(next) / D.players.length * 100) + '%"></i></div>' +
      '<p class="sub">' + inCount(next) + ' of ' + D.players.length + ' players marked in. Bring his Rockhurst student ID.</p></section>' : "";
    return hero +
      '<div class="actions"><a class="act" href="sms:' + tel(t.coachPhone) + '">' + svg("text") + 'Text Coach</a>' +
      '<button class="act" data-go="update">' + svg("update") + 'Update player</button>' +
      '<a class="act" href="' + esc(t.uniformLink) + '" target="_blank" rel="noopener">' + svg("uniform") + 'Order uniform</a></div>' +
      (todo.length ? '<section class="card"><h2>Coming up</h2><div class="list">' + todo.map(function (x) {
        return '<div class="item">' + whenBox(x[0]) + '<div class="stack"><h3>' + esc(x[1]) + '</h3><p class="sub">' + x[2] + '</p></div></div>';
      }).join("") + '</div></section>' : "") +
      D.news.map(function (n) { return '<section class="card"><span class="kicker">UPDATE · ' + esc(day(n.date).toUpperCase()) + '</span><h2>' + esc(n.title) + '</h2><p>' + esc(n.body) + '</p></section>'; }).join("") +
      contactCard();
  },
  schedule: function () {
    return '<section class="card"><h2>Schedule</h2><p class="sub">Saturdays, any time 8:00 am to 10:15 pm. Six games guaranteed. Times and gyms post about a week ahead.</p><div class="list">' +
      D.games.map(function (g) {
        return '<div class="item">' + whenBox(g.date) + '<div class="stack" style="flex:1"><h3>' + esc(day(g.date, { weekday: "long" })) +
          (g.kind === "tournament" ? ' <span class="pill">Tournament</span>' : "") + '</h3><p class="sub">' + esc(where(g)) + '</p></div><span class="sub">' + inCount(g) + ' in</span></div>';
      }).join("") + '</div></section>' +
      '<section class="card"><p class="sub"><a href="' + esc(D.team.cyoLink) + '" target="_blank" rel="noopener">CYO high school basketball page</a> for gym addresses and rules.</p></section>';
  },
  team: function () {
    var reg = D.players.filter(function (p) { return p.registered; }).length;
    return '<section class="card"><div class="row"><h2>Roster</h2><span class="pill ' + (reg === D.players.length ? "good" : "warn") + '">' + reg + ' of ' + D.players.length + ' on CYO</span></div><div class="list">' +
      D.players.map(function (p) {
        return '<div class="item" style="align-items:center"><div class="num' + (p.jersey ? "" : " empty") + '">' + esc(p.jersey || "–") + '</div><div class="stack" style="flex:1"><h3>' + esc(p.name) + '</h3>' +
          '<div>' + (p.registered ? '' : '<span class="pill bad">Not on CYO yet</span> ') + uniPill(p.uniform) + '</div></div></div>';
      }).join("") + '</div><p class="sub">Numbers show once Coach Travis confirms them.</p></section>';
  },
  uniform: function () {
    var t = D.team;
    return '<section class="card"><span class="kicker">ORDER BY ' + esc(day(t.uniformDue).toUpperCase()) + '</span><h2>Get the uniform</h2>' +
      '<p>Wait until your jersey number is confirmed, then order. All orders are custom made and final.</p>' +
      '<a class="btn" href="' + esc(t.uniformLink) + '" target="_blank" rel="noopener">Open the Jock\'s Nitch CYO store</a>' +
      '<p class="sub">CYO high school uniforms are required. A past-season CYO uniform is fine if it meets the requirements. No other uniform, and no jewelry during games.</p></section>' +
      '<section class="card"><h2>What to buy</h2><p class="sub">One jersey and one pair of shorts, 7" or 9".</p><div class="scroll"><table><thead><tr><th>Item</th><th>Price</th><th>Sizes</th></tr></thead><tbody>' +
      '<tr><td>Champro Victorious reversible jersey, Scarlet/White</td><td>$26</td><td>Youth L, Youth XL, Adult S, M, L, XL, 2XL (+$2), 3XL (+$2)</td></tr>' +
      '<tr><td>Dynamic Tricot 7" mesh short, Black</td><td>$14</td><td>Youth L, Youth XL, S, M, L, XL, 2XL (+$2), 3XL (+$2)</td></tr>' +
      '<tr><td>Champro tricot short with liner, 9" inseam, Black</td><td>$14</td><td>Adult S, M, L, XL, 2XL (+$2), 3XL (+$2)</td></tr></tbody></table></div>' +
      '<p><b>Legal numbers only:</b> 0-5, 10-15, 20-25, 30-35, 40-45, 50-55.</p></section>' +
      '<section class="card"><h2>Good to know</h2><div class="list">' +
      '<div class="item">Orders are placed the Monday after you submit. No confirmation email means it didn\'t go through.</div>' +
      '<div class="item">You\'ll get an email when it\'s ready to pick up.</div>' +
      '<div class="item">In person: Jock\'s Nitch Sports, 11966 W. 119th St., Overland Park. Mon-Fri 10 am-5 pm, 913-345-2882. The paper form adds 9.35% tax.</div></div></section>';
  },
  update: function () {
    var opt = function (list, first) { return '<option value="">' + (first || "Choose") + '</option>' + list.map(function (v) { return '<option>' + esc(v) + '</option>'; }).join(""); };
    var seg = function (name) {
      return '<div class="seg">' + ["yes", "maybe", "no"].map(function (v) {
        return '<label><input type="radio" form="upd" name="' + name + '" value="' + v + '" aria-label="' + AV[v] + '"><span>' + AV[v] + '</span></label>';
      }).join("") + '</div>';
    };
    return '<form class="card" id="upd"><h2>Update my player</h2><p class="sub">Fill in what you know, then tap Send at the bottom. It opens a pre-filled email to Coach Travis. Send again any time something changes.</p>' +
      '<div class="grid"><label class="full">Player<select name="player" required>' + opt(D.players.map(function (p) { return p.name; }), "Choose your son") + '</select></label>' +
      '<label>Jersey number, 1st choice<select name="jersey1">' + opt(LEGAL) + '</select></label>' +
      '<label>Jersey number, 2nd choice<select name="jersey2">' + opt(LEGAL) + '</select></label>' +
      '<label class="full">Uniform<select name="uniform"><option value="">Choose</option><option value="needs">We need to order one</option><option value="ordered">We ordered it</option><option value="has">He already has a CYO uniform</option></select></label>' +
      '<label>Jersey size<select name="top">' + opt(SIZES) + '</select></label>' +
      '<label>Short size<select name="shorts">' + opt(SIZES) + '</select></label>' +
      '<label class="full">Short length<select name="length"><option value="">Choose</option><option>7 inch mesh (youth or adult)</option><option>9 inch with liner (adult only)</option></select></label></div></form>' +
      '<section class="card"><h2>Which Saturdays can he play?</h2><div class="list">' +
      D.games.map(function (g) { return '<div class="item" style="align-items:center;justify-content:space-between"><span>' + esc(day(g.date)) + (g.kind === "tournament" ? '<br><span class="sub">Tournament</span>' : "") + '</span>' + seg("g_" + g.date) + '</div>'; }).join("") +
      '</div></section><section class="card"><label>Anything else<textarea form="upd" name="note" rows="2"></textarea></label><p class="err" id="updErr" role="alert"></p>' +
      '<button class="btn" type="submit" form="upd">' + svg("mail") + 'Send to Coach Travis</button></section>';
  }
};
function render() {
  $("app").innerHTML =
    '<header class="top"><div class="in"><div class="logo">RH</div><div class="grow"><h1>Hawklets CYO Basketball</h1><p>Rockhurst freshmen · ' + esc(D.team.season) + '</p></div></div></header>' +
    '<nav class="tabs" aria-label="Sections"><div class="in">' + TABS.map(function (t) {
      return '<button data-go="' + t[0] + '"' + (t[0] === TAB ? ' aria-current="page"' : "") + '>' + svg(t[0]) + t[1] + '</button>';
    }).join("") + '</div></nav><main>' + VIEWS[TAB]() + '</main>';
  scrollTo(0, 0);
}
document.addEventListener("click", function (ev) {
  var go = ev.target.closest("[data-go]"); if (!go) return;
  ev.preventDefault(); TAB = go.dataset.go; render();
});
function mailUrl(form) {
  var f = new FormData(form), name = f.get("player");
  if (!name) return "";
  var lines = ["Player: " + name, "Jersey 1st choice: " + (f.get("jersey1") || "-"), "Jersey 2nd choice: " + (f.get("jersey2") || "-"),
    "Uniform: " + (f.get("uniform") || "-"), "Jersey size: " + (f.get("top") || "-"), "Short size: " + (f.get("shorts") || "-"), "Short length: " + (f.get("length") || "-"), "", "Availability:"];
  D.games.forEach(function (g) { var v = f.get("g_" + g.date); if (v) lines.push(g.date + ": " + AV[v]); });
  if (f.get("note")) lines.push("", "Note: " + f.get("note"));
  return "mailto:" + D.team.coachEmail + "?subject=" + encodeURIComponent("Team app update: " + name) + "&body=" + encodeURIComponent(lines.join("\n"));
}
document.addEventListener("submit", function (ev) {
  if (ev.target.id !== "upd") return; ev.preventDefault();
  var url = mailUrl(ev.target);
  if (url) location.href = url; else { $("updErr").textContent = "Choose your son at the top first."; }
});
