<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Rockhurst Freshmen CYO Basketball</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#111827;--muted:#4b5565;--line:#d3d9e4;--blue:#1f4e94;--blue2:#285ea8;--soft:#e3ebf8;
  --good:#12632f;--goodbg:#e2f3e8;--warn:#7a4b00;--warnbg:#fdf0d5;--bad:#a61b1b;--badbg:#fbe4e4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:24px}h2{font-size:20px}h3{font-size:17px}
p{margin:0}
a{color:var(--blue)}
header{background:var(--blue2);color:#fff;padding:18px 16px 14px}
header p{opacity:.92;font-size:15px}
nav{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);display:flex;overflow-x:auto}
nav button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:12px 10px;font:600 15px system-ui;color:var(--muted);cursor:pointer}
nav button[aria-current=page]{color:var(--blue);border-bottom-color:var(--blue)}
main{max-width:720px;margin:0 auto;padding:14px 12px 48px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sub{color:var(--muted);font-size:15px}
.big{font-size:26px;font-weight:800}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--blue);white-space:nowrap}
.good{background:var(--goodbg);color:var(--good)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.list{display:flex;flex-direction:column}
.list>div{padding:10px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0;padding-top:0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:15px}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-height:44px;width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.btn{font:700 16px system-ui;border:0;border-radius:10px;padding:12px 18px;background:var(--blue);color:#fff;cursor:pointer;min-height:46px;text-decoration:none;text-align:center}
.seg{display:flex;flex:0 0 210px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{flex:1;flex-direction:row;justify-content:center;font-weight:600;padding:0;margin:0;border-left:1px solid var(--line);position:relative}
.seg label:first-child{border-left:0}
.seg input{position:absolute;left:0;top:0;opacity:0;width:1px;height:1px;pointer-events:none}
.seg span{display:block;width:100%;text-align:center;padding:9px 0;cursor:pointer}
.seg input:checked+span{background:var(--blue);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--blue);outline-offset:-3px}
.err{color:var(--bad);font-weight:600}
#lock{max-width:420px;margin:40px auto;padding:0 12px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="lock">
  <form class="card" id="lockForm">
    <h1>Rockhurst Freshmen CYO Basketball</h1>
    <p class="sub">Enter the team password from Coach Travis's email.</p>
    <label>Team password<input id="pw" type="password" autocomplete="current-password" required></label>
    <p class="err" id="lockErr" role="alert"></p>
    <button class="btn" type="submit">Open team page</button>
  </form>
</div>
<div id="app" hidden></div>
<script>
"use strict";
var D, TAB = "home", $ = function (id) { return document.getElementById(id); };
var LEGAL = ["0","1","2","3","4","5","10","11","12","13","14","15","20","21","22","23","24","25","30","31","32","33","34","35","40","41","42","43","44","45","50","51","52","53","54","55"];
var SIZES = ["Youth Large","Youth X-Large","Adult Small","Adult Medium","Adult Large","Adult X-Large","Adult 2X-Large","Adult 3X-Large"];
var AV = { yes: "In", maybe: "Maybe", no: "Out" };
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
var day = function (d, o) { return new Date(d + "T12:00:00").toLocaleDateString("en-US", o || { weekday: "short", month: "short", day: "numeric" }); };
var today = new Date().toLocaleDateString("en-CA");
var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };

/* ---------- unlock: data.enc is AES-GCM encrypted with a key derived from the team password ---------- */
async function unlock(pw) {
  var e = await (await fetch("data.enc", { cache: "no-store" })).json();
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(e.salt), iterations: e.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(e.iv) }, key, b64(e.ct))));
}
async function openApp(pw, remember) {
  D = await unlock(pw);
  if (remember) localStorage.setItem("teamPw", pw);
  $("lock").hidden = true; $("app").hidden = false; render();
}
$("lockForm").onsubmit = function (ev) {
  ev.preventDefault(); $("lockErr").textContent = "";
  openApp($("pw").value.trim(), true).catch(function () { $("lockErr").textContent = "That password didn't work. Check Coach Travis's email."; });
};
if (localStorage.getItem("teamPw")) openApp(localStorage.getItem("teamPw"), false).catch(function () { localStorage.removeItem("teamPw"); });

/* ---------- views ---------- */
function gameLine(g) {
  var bits = [g.time, g.location, g.opponent && "vs " + g.opponent].filter(Boolean);
  return bits.length ? bits.join(" · ") : "Time and gym post about a week ahead";
}
function inCount(g) { return D.players.filter(function (p) { return p.avail[g.date] === "yes"; }).length; }
function uniPill(u) {
  return { has: '<span class="pill good">Has one</span>', ordered: '<span class="pill good">Ordered</span>', needs: '<span class="pill warn">To order</span>' }[u] || '<span class="pill">Not sent</span>';
}
var VIEWS = {
  home: function () {
    var t = D.team, next = D.games.filter(function (g) { return g.date >= today; })[0];
    return (next ? '<section class="card"><div class="row"><h2>Next game</h2>' + (next.kind === "tournament" ? '<span class="pill">Tournament</span>' : "") + '</div>' +
      '<p class="big">' + esc(day(next.date, { weekday: "long", month: "long", day: "numeric" })) + '</p><p class="sub">' + esc(gameLine(next)) + '</p>' +
      '<p class="sub">' + inCount(next) + ' of ' + D.players.length + ' players marked in</p></section>' : "") +
      '<section class="card"><h2>To do</h2><div class="list">' +
      '<div><h3>Send jersey numbers, sizes and availability</h3><p class="sub">Use <a href="#" data-go="update">Update my player</a>. It opens an email to Coach Travis.</p></div>' +
      '<div><h3>Order the uniform by ' + esc(day(t.uniformDue)) + '</h3><p class="sub">After your number is confirmed. See <a href="#" data-go="uniforms">Uniforms</a>.</p></div>' +
      '<div><h3>Pay $' + esc(t.fee) + ' by ' + esc(day(t.feeDue)) + '</h3><p class="sub">Venmo ' + esc(t.venmo) + ' or a check to ' + esc(t.checkPayee) + '. Put your son\'s name in the note.</p></div>' +
      '<div><h3>Bring his Rockhurst student ID to every game</h3><p class="sub">CYO checks IDs at the gym.</p></div></div></section>' +
      D.news.map(function (n) { return '<section class="card"><div class="row"><h2>' + esc(n.title) + '</h2><span class="sub">' + esc(day(n.date)) + '</span></div><p>' + esc(n.body) + '</p></section>'; }).join("") +
      '<section class="card"><h2>Contact</h2><p>Coach ' + esc(t.coach) + ', <a href="mailto:' + esc(t.coachEmail) + '">' + esc(t.coachEmail) + '</a>' + (t.assistant ? '<br>Assistant coach ' + esc(t.assistant) : "") + '</p>' +
      '<p class="sub"><a href="' + esc(t.cyoLink) + '" target="_blank" rel="noopener">CYO high school basketball page</a> for rules and gym addresses. Updated ' + esc(day(D.updated)) + '.</p></section>';
  },
  schedule: function () {
    return '<section class="card"><h2>Schedule</h2><p class="sub">All games are Saturdays, any time from 8:00 am to 10:15 pm. Six games guaranteed.</p><div class="list">' +
      D.games.map(function (g) {
        return '<div class="row"><div><h3>' + esc(day(g.date, { weekday: "short", month: "long", day: "numeric" })) + (g.kind === "tournament" ? ' <span class="pill">Tournament</span>' : "") + '</h3><p class="sub">' + esc(gameLine(g)) + '</p></div><span class="sub">' + inCount(g) + ' in</span></div>';
      }).join("") + '</div></section>';
  },
  team: function () {
    return '<section class="card"><h2>Team (' + D.players.length + ' players)</h2><div style="overflow-x:auto"><table><thead><tr><th>#</th><th>Player</th><th>CYO</th><th>Uniform</th></tr></thead><tbody>' +
      D.players.map(function (p) {
        return '<tr><td>' + esc(p.jersey || "–") + '</td><td>' + esc(p.name) + '</td><td>' + (p.registered ? '<span class="pill good">Registered</span>' : '<span class="pill bad">Not yet</span>') + '</td><td>' + uniPill(p.uniform) + '</td></tr>';
      }).join("") + '</tbody></table></div><p class="sub">Numbers show once Coach Travis confirms them.</p></section>';
  },
  uniforms: function () {
    var t = D.team;
    return '<section class="card"><h2>Uniforms</h2><p><b>Wait until your jersey number is confirmed, then order by ' + esc(day(t.uniformDue)) + '.</b> All orders are custom made and sales are final.</p>' +
      '<p>CYO high school uniforms are required. A past-season CYO uniform is fine if it meets the requirements. You may not use any other uniform. No jewelry during games.</p>' +
      '<a class="btn" href="' + esc(t.uniformLink) + '" target="_blank" rel="noopener">Order at the Jock\'s Nitch CYO store</a></section>' +
      '<section class="card"><h2>What to buy</h2><p>One jersey and one pair of shorts (7" or 9").</p><div style="overflow-x:auto"><table><thead><tr><th>Item</th><th>Price</th><th>Sizes</th></tr></thead><tbody>' +
      '<tr><td>Champro Victorious reversible jersey, Scarlet/White</td><td>$26</td><td>Youth L, Youth XL, Adult S, M, L, XL, 2XL (+$2), 3XL (+$2)</td></tr>' +
      '<tr><td>Dynamic Tricot 7" mesh short, Black</td><td>$14</td><td>Youth L, Youth XL, S, M, L, XL, 2XL (+$2), 3XL (+$2)</td></tr>' +
      '<tr><td>Champro tricot short with liner, 9" inseam, Black</td><td>$14</td><td>Adult S, M, L, XL, 2XL (+$2), 3XL (+$2)</td></tr></tbody></table></div>' +
      '<p><b>Legal numbers only:</b> 0-5, 10-15, 20-25, 30-35, 40-45, 50-55.</p></section>' +
      '<section class="card"><h2>Good to know</h2><div class="list">' +
      '<div>Orders are placed the Monday after you submit. No confirmation email means the order didn\'t go through.</div>' +
      '<div>You\'ll get an email when it\'s ready to pick up.</div>' +
      '<div>In person: Jock\'s Nitch Sports, 11966 W. 119th St., Overland Park, KS 66213. Mon-Fri 10 am-5 pm. 913-345-2882. Paper order form adds 9.35% tax.</div>' +
      '<div>Sizing questions: stop by or call before ordering.</div></div></section>';
  },
  update: function () {
    var opt = function (list, label) { return '<option value="">' + (label || "Choose") + '</option>' + list.map(function (v) { return '<option>' + esc(v) + '</option>'; }).join(""); };
    var seg = function (name) {
      return '<div class="seg" role="radiogroup">' + ["yes", "maybe", "no"].map(function (v) {
        return '<label><input type="radio" name="' + name + '" value="' + v + '"><span>' + AV[v] + '</span></label>';
      }).join("") + '</div>';
    };
    return '<form class="card" id="upd"><h2>Update my player</h2><p class="sub">Fill in what you know and tap Send. It opens an email to Coach Travis with your answers. Send again any time something changes.</p>' +
      '<div class="grid"><label class="full">Player<select name="player" required>' + opt(D.players.map(function (p) { return p.name; }), "Choose your son") + '</select></label>' +
      '<label>Jersey number, 1st choice<select name="jersey1">' + opt(LEGAL) + '</select></label>' +
      '<label>Jersey number, 2nd choice<select name="jersey2">' + opt(LEGAL) + '</select></label>' +
      '<label class="full">Uniform<select name="uniform"><option value="">Choose</option><option value="needs">We need to order one</option><option value="ordered">We ordered it</option><option value="has">He already has a CYO uniform</option></select></label>' +
      '<label>Jersey size<select name="top">' + opt(SIZES) + '</select></label>' +
      '<label>Short size<select name="shorts">' + opt(SIZES) + '</select></label>' +
      '<label class="full">Short length<select name="length"><option value="">Choose</option><option>7 inch mesh (youth or adult)</option><option>9 inch with liner (adult only)</option></select></label></div>' +
      '<h3>Which Saturdays can he play?</h3><div class="list">' +
      D.games.map(function (g) { return '<div class="row"><span>' + esc(day(g.date)) + (g.kind === "tournament" ? " (tournament)" : "") + '</span>' + seg("g_" + g.date) + '</div>'; }).join("") +
      '</div><label>Anything else<textarea name="note" rows="2"></textarea></label><p class="err" id="updErr" role="alert"></p><button class="btn" type="submit">Send to Coach Travis</button></form>';
  }
};
var TABS = [["home", "Home"], ["schedule", "Schedule"], ["team", "Team"], ["uniforms", "Uniforms"], ["update", "Update"]];
function render() {
  $("app").innerHTML = '<header><h1>' + esc(D.team.name) + '</h1><p>' + esc(D.team.season) + ' · Coach ' + esc(D.team.coach) + '</p></header>' +
    '<nav>' + TABS.map(function (t) { return '<button data-go="' + t[0] + '"' + (t[0] === TAB ? ' aria-current="page"' : "") + '>' + t[1] + '</button>'; }).join("") + '</nav>' +
    '<main>' + VIEWS[TAB]() + '</main>';
  scrollTo(0, 0);
}
document.addEventListener("click", function (ev) {
  var go = ev.target.closest("[data-go]"); if (!go) return;
  ev.preventDefault(); TAB = go.dataset.go; render();
});
function mailUrl(form) {
  var f = new FormData(form), name = f.get("player");
  if (!name) return "";
  var lines = ["Player: " + name, "Jersey 1st choice: " + (f.get("jersey1") || "-"), "Jersey 2nd choice: " + (f.get("jersey2") || "-"),
    "Uniform: " + (f.get("uniform") || "-"), "Jersey size: " + (f.get("top") || "-"), "Short size: " + (f.get("shorts") || "-"), "Short length: " + (f.get("length") || "-"), "", "Availability:"];
  D.games.forEach(function (g) { var v = f.get("g_" + g.date); if (v) lines.push(g.date + ": " + AV[v]); });
  if (f.get("note")) lines.push("", "Note: " + f.get("note"));
  return "mailto:" + D.team.coachEmail + "?subject=" + encodeURIComponent("Team app update: " + name) + "&body=" + encodeURIComponent(lines.join("\n"));
}
document.addEventListener("submit", function (ev) {
  if (ev.target.id !== "upd") return; ev.preventDefault();
  var url = mailUrl(ev.target);
  if (url) location.href = url; else $("updErr").textContent = "Choose your son first.";
});
</script>
</body>
</html>
